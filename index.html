};

let store = {

  users: [
    {id:'u-admin', name:'Akshay Bajaj Jain (Admin)', email:'admin@sadhnaagro.local', role:'admin', can_override_negative_stock:true}

  admin:      { master:true, purchase:true, opening:true, production:true, dispatch:true, sales:true, expense:true, editDel:true, users:true, settings:true },
  production: { master:false, purchase:false, opening:false, production:true, dispatch:true, sales:false, expense:false, editDel:false, users:false, settings:false },
  store:      { master:true, purchase:true, opening:true, production:false, dispatch:true, sales:false, expense:false, editDel:false, users:false, settings:false },

// --- STORAGE & SAFE LEGACY MIGRATION ---
function loadStorage(){
  try{
    cfg = {...cfg, ...JSON.parse(localStorage.getItem(CFG_KEY) || '{}')};
    const raw = JSON.parse(localStorage.getItem(DB_KEY) || '{}');
    ['masters','parties','transactions','users','auditLogs'].forEach(k => {
      if(Array.isArray(raw[k])){
        const map = new Map();
        raw[k].forEach(item => { if(item && item.id) map.set(item.id, item); });
        store[k] = Array.from(map.values());
      }
    });
    syncQueue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
    if(!Array.isArray(syncQueue)) syncQueue = [];

    if(!cfg.migrated){
      LEGACY_KEYS.forEach(lk => {
        const old = JSON.parse(localStorage.getItem(lk) || 'null');
        if(!old) return;
        const list = old.products || old.items || [];
        list.forEach(p => {
          if(p.id && !store.masters.some(m => m.id === p.id)){
            const mt = p.item_type === 'raw' || p.type === 'raw' ? 'raw'
                     : p.item_type === 'print' || p.type === 'print' ? 'print'
                     : p.item_type === 'packing' ? 'packing' : 'product';
            store.masters.push({
              id: p.id, master_type: mt, code: p.code || '', name: p.name,
              category: p.category || 'General', unit: p.unit || 'kg',
              pouch_wt_g: n(p.pouch_wt_g), gst_rate: n(p.gst_rate ?? 18),
              default_rate: n(p.sale_rate), min_stock: n(p.min_stock),
              status: 'active', updated_at: new Date().toISOString()
            });
          }
        });
        (old.purchases || []).forEach(pur => {
          if(pur.id && !store.transactions.some(t => t.id === pur.id)){
            const base = r2(n(pur.qty)*n(pur.rate));
            const gstAmt = r2(base * n(pur.gst)/100);
            store.transactions.push({
              id: pur.id, tx_type:'purchase', tx_number: pur.bill || 'MIG-PUR', tx_date: pur.date || today(),
              status:'active', created_by:'Legacy-Import', created_at:new Date().toISOString(), updated_at:new Date().toISOString(),
              payload:{ item_id: pur.product, party_name: pur.supplier || 'Supplier', qty: n(pur.qty), rate: n(pur.rate), gst_rate: n(pur.gst), base_amount: base, gst_amount: gstAmt, grand_total: r2(base+gstAmt) }
            });
          }
        });
      });
      cfg.migrated = true;
      addAudit('MIGRATE', 'System', 'LEGACY', 'पुराना Local Data सुरक्षित रूप से नए ERP में आयात किया गया');
      persist();
    }
  }catch(e){ console.error('Storage load error:', e); }
  refreshBadges();
}

function persist(){
  localStorage.setItem(DB_KEY, JSON.stringify(store));
  localStorage.setItem(QUEUE_KEY, JSON.stringify(syncQueue));
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));

}

function addAudit(action, module, txId, summary){
  const entry = {
    id: uid(),
    actor_email: authUser?.email || 'Local-Operator',
    actor_role: cfg.activeRole,
    action, module, tx_id: String(txId), summary,
    created_at: new Date().toISOString()
  };
  store.auditLogs.unshift(entry);
  if(store.auditLogs.length > 1500) store.auditLogs.length = 1500;
  syncQueue.push({op:'audit', id: entry.id, data: entry, retries:0, lastError:''});
}

function queueUpsert(op, id, data){
  syncQueue = syncQueue.filter(q => !(q.op === op && q.id === id));
  syncQueue.push({op, id, data, retries:0, lastError:''});
  persist();
}

// --- MULTI-MATERIAL PRODUCTION COSTING ENGINE ---
function evaluateProduction(p){
  const estPouches = Math.max(0, n(p.estimated_pouches));
  const actualPouches = Math.max(0, n(p.actual_pouches));
  const pouchWtG = Math.max(0, n(p.pouch_wt_g));
  const outputKg = r3((actualPouches * pouchWtG) / 1000);

  const packets = r2(actualPouches / 36);
  const boris = r3(actualPouches / 720);
  const outerCount = Math.ceil(actualPouches / 36);
  const boriCount = Math.ceil(actualPouches / 720);

  const rawLines = Array.isArray(p.raw_lines) ? p.raw_lines : [];
  let totalRawQty = 0, totalRawCost = 0;
  const evaluatedRaw = rawLines.map(line => {
    const consumed = Math.max(0, r3(n(line.open) - n(line.close)));
    const cost = r2(consumed * n(line.rate));
    totalRawQty = r3(totalRawQty + consumed);
    totalRawCost = r2(totalRawCost + cost);
    return {...line, consumed, cost};
  });

  const printLines = Array.isArray(p.print_lines) ? p.print_lines : [];
  let totalPrintUsed = 0, totalPrintWastage = 0, totalPrintGoodUsed = 0;
  let totalPrintGoodCost = 0, totalPrintWastageCost = 0;

  const evaluatedPrint = printLines.map(line => {
    const physicalUsed = Math.max(0, r3(n(line.open) - n(line.close)));
    const wastageQty = Math.min(physicalUsed, Math.max(0, r3(n(line.wastage))));
    const netGoodUsed = Math.max(0, r3(physicalUsed - wastageQty));
    const goodCost = r2(netGoodUsed * n(line.rate));
    const wasteCost = r2(wastageQty * n(line.rate));

    totalPrintUsed = r3(totalPrintUsed + physicalUsed);
    totalPrintWastage = r3(totalPrintWastage + wastageQty);
    totalPrintGoodUsed = r3(totalPrintGoodUsed + netGoodUsed);
    totalPrintGoodCost = r2(totalPrintGoodCost + goodCost);
    totalPrintWastageCost = r2(totalPrintWastageCost + wasteCost);

    return {...line, physicalUsed, wastageQty, netGoodUsed, goodCost, wasteCost};
  });

  const otherPrintCost = r2(n(p.other_printing_cost));
  const labourHrs = n(p.labour_hrs);
  const labourRate = n(p.labour_rate);
  const labourCost = r2(labourHrs * labourRate);

  const machHrs = n(p.mach_hrs);
  const machRate = p.machine_rate !== undefined ? n(p.machine_rate) : cfg.machineRate;
  const machineCost = r2(machHrs * machRate);

  const packingCost = r2(n(p.packing_cost));
  const outerRate = n(p.outer_rate);
  const boriRate = n(p.bori_rate);
  const outerCost = r2(outerCount * outerRate);
  const boriCost = r2(boriCount * boriRate);
  const denglerCost = r2(n(p.dengler_cost));
  const marketingCost = r2(n(p.marketing_cost));

  const directOperationalCost = r2(
    totalRawCost + totalPrintGoodCost + totalPrintWastageCost + otherPrintCost +
    labourCost + machineCost + packingCost + outerCost + boriCost + denglerCost + marketingCost
  );

  const intRate = p.interest_rate !== undefined ? n(p.interest_rate) : cfg.interestRate;
  const intDays = p.interest_days !== undefined ? n(p.interest_days) : cfg.interestDays;
  const interestCost = r2((directOperationalCost * intRate * intDays) / 36500);

  const netProductionCost = r2(directOperationalCost + interestCost);
  const gstRate = p.gst_rate !== undefined ? n(p.gst_rate) : cfg.gstRate;
  const itcEligible = p.itc_eligible !== false;
  const gstAmount = r2((netProductionCost * gstRate) / 100);
  const grossCostWithGst = r2(netProductionCost + gstAmount);
  const effectiveFinalCost = itcEligible ? netProductionCost : grossCostWithGst;

  return {
    estPouches, actualPouches, pouchWtG, outputKg,
    packets, boris, outerCount, boriCount,
    evaluatedRaw, totalRawQty, totalRawCost,
    evaluatedPrint, totalPrintUsed, totalPrintWastage, totalPrintGoodUsed, totalPrintGoodCost, totalPrintWastageCost,
    otherPrintCost, labourHrs, labourRate, labourCost,
    machHrs, machRate, machineCost,
    packingCost, outerRate, outerCost, boriRate, boriCost,
    denglerCost, marketingCost,
    directOperationalCost, intRate, intDays, interestCost,
    netProductionCost, gstRate, itcEligible, gstAmount, grossCostWithGst, effectiveFinalCost,
    costPerPouch: actualPouches ? r2(effectiveFinalCost / actualPouches) : 0,
    costPerPacket: packets ? r2(effectiveFinalCost / packets) : 0,
    costPerKg: outputKg ? r2(effectiveFinalCost / outputKg) : 0
  };
}

// --- AUTOMATIC DOUBLE-ENTRY-PROOF STOCK LEDGER ---
function buildStockLedger(excludeTxId = null){
  const map = new Map();
  store.masters.filter(m => m.status === 'active').forEach(m => {
    map.set(m.id, {
      ...m,
      opening: 0, purchased: 0, purchaseReturn: 0, consumed: 0,
      produced: 0, dispatched: 0, sold: 0, saleReturn: 0,
      factoryStock: 0, godownStock: 0, movements: []
    });
  });

  const activeTxs = store.transactions
    .filter(t => t.status === 'active' && t.id !== excludeTxId)
    .sort((a,b) => String(a.tx_date).localeCompare(String(b.tx_date)));

  activeTxs.forEach(tx => {
    const p = tx.payload || {};
    const recordMove = (item, loc, change, label) => {
      item.movements.push({ tx_id: tx.id, tx_number: tx.tx_number, date: tx.tx_date, type: tx.tx_type, location: loc, change, label });
    };

    if(tx.tx_type === 'opening_stock'){
      const it = map.get(p.item_id);
      if(it){
        const q = r3(n(p.qty));
        if(p.location === 'godown') it.godownStock = r3(it.godownStock + q);
        else { it.opening = r3(it.opening + q); it.factoryStock = r3(it.factoryStock + q); }
        recordMove(it, p.location || 'factory', q, 'Opening Stock');
      }
    }
    else if(tx.tx_type === 'purchase'){
      const it = map.get(p.item_id);
      if(it){
        const q = r3(n(p.qty));
        it.purchased = r3(it.purchased + q);
        it.factoryStock = r3(it.factoryStock + q);
        recordMove(it, 'factory', +q, `Purchase (${p.party_name || ''})`);
      }
    }
    else if(tx.tx_type === 'purchase_return'){
      const it = map.get(p.item_id);
      if(it){
        const q = r3(n(p.qty));
        it.purchaseReturn = r3(it.purchaseReturn + q);
        it.factoryStock = r3(it.factoryStock - q);
        recordMove(it, 'factory', -q, `Purchase Return (${p.party_name || ''})`);
      }
    }
    else if(tx.tx_type === 'production'){
      const c = evaluateProduction(p);
      c.evaluatedRaw.forEach(rl => {
        const it = map.get(rl.item_id);
        if(it && rl.consumed > 0){
          it.consumed = r3(it.consumed + rl.consumed);
          it.factoryStock = r3(it.factoryStock - rl.consumed);
          recordMove(it, 'factory', -rl.consumed, `Production Batch ${tx.tx_number}`);
        }
      });
      c.evaluatedPrint.forEach(pl => {
        const it = map.get(pl.item_id);
        if(it && pl.physicalUsed > 0){
          it.consumed = r3(it.consumed + pl.physicalUsed);
          it.factoryStock = r3(it.factoryStock - pl.physicalUsed);
          recordMove(it, 'factory', -pl.physicalUsed, `Printing Batch ${tx.tx_number} (Waste: ${pl.wastageQty})`);
        }
      });
      if(p.outer_item_id && map.has(p.outer_item_id) && c.outerCount > 0){
        const oi = map.get(p.outer_item_id);
        oi.consumed = r3(oi.consumed + c.outerCount);
        oi.factoryStock = r3(oi.factoryStock - c.outerCount);
        recordMove(oi, 'factory', -c.outerCount, `LD Outer Batch ${tx.tx_number}`);
      }
      if(p.bori_item_id && map.has(p.bori_item_id) && c.boriCount > 0){
        const bi = map.get(p.bori_item_id);
        bi.consumed = r3(bi.consumed + c.boriCount);
        bi.factoryStock = r3(bi.factoryStock - c.boriCount);
        recordMove(bi, 'factory', -c.boriCount, `Bori Batch ${tx.tx_number}`);
      }
      const prod = map.get(p.product_id);
      if(prod){
        const addQty = (prod.unit === 'pouch' || prod.unit === 'piece') ? c.actualPouches : c.outputKg;
        prod.produced = r3(prod.produced + addQty);
        prod.factoryStock = r3(prod.factoryStock + addQty);
        recordMove(prod, 'factory', +addQty, `Production Output ${tx.tx_number}`);
      }
    }
    else if(tx.tx_type === 'dispatch'){
      const prod = map.get(p.product_id);
      if(prod){
        const q = r3(n(p.qty));
        prod.dispatched = r3(prod.dispatched + q);
        prod.factoryStock = r3(prod.factoryStock - q);
        prod.godownStock = r3(prod.godownStock + q);
        recordMove(prod, 'factory->godown', q, `Dispatch to ${p.godown_name || 'Godown'}`);
      }
    }
    else if(tx.tx_type === 'sale'){
      const prod = map.get(p.product_id);
      if(prod){
        const q = r3(n(p.qty));
        prod.sold = r3(prod.sold + q);
        prod.godownStock = r3(prod.godownStock - q);
        recordMove(prod, 'godown', -q, `Sale (${p.party_name || ''})`);
      }
    }
    else if(tx.tx_type === 'sale_return'){
      const prod = map.get(p.product_id);
      if(prod){
        const q = r3(n(p.qty));
        prod.saleReturn = r3(prod.saleReturn + q);
        prod.godownStock = r3(prod.godownStock + q);
        recordMove(prod, 'godown', +q, `Sales Return (${p.party_name || ''})`);
      }
    }
  });

  return Array.from(map.values());
}

// --- CLOUD SYNC (SUPABASE + GOOGLE SHEETS WITH REAL STATUS) ---
async function connectSupabase(){
  if(!window.supabase) return;
  if(!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const {data} = await sb.auth.getSession();
  authUser = data?.session?.user || null;
}

async function runCloudSync(includeGoogleSheets = false){
  if(syncing) return;
  syncing = true;
  cfg.lastSyncStatus = 'Syncing...';
  refreshBadges();

  let sbOk = false, gsOk = false, errMsg = '';

  try{
    if(sb && authUser && navigator.onLine){
      const remainingQueue = [];
      for(const q of syncQueue){
        let res = {error: null};
        if(q.op === 'master') res = await sb.from('sadhna_masters').upsert({...q.data, user_id: authUser.id}, {onConflict:'id'});
        else if(q.op === 'party') res = await sb.from('sadhna_parties').upsert({...q.data, user_id: authUser.id}, {onConflict:'id'});
        else if(q.op === 'tx') res = await sb.from('sadhna_transactions').upsert({...q.data, user_id: authUser.id}, {onConflict:'id'});
        else if(q.op === 'audit') res = await sb.from('sadhna_audit_logs').upsert({...q.data, user_id: authUser.id}, {onConflict:'id'});

        if(res.error){
          q.retries = (q.retries || 0) + 1;
          q.lastError = res.error.message || 'Supabase Error';
          errMsg = q.lastError;
          remainingQueue.push(q);
        }
      }
      syncQueue = remainingQueue;

      if(syncQueue.length === 0){
        const [mRes, pRes, tRes] = await Promise.all([
          sb.from('sadhna_masters').select('*').eq('user_id', authUser.id),
          sb.from('sadhna_parties').select('*').eq('user_id', authUser.id),
          sb.from('sadhna_transactions').select('*').eq('user_id', authUser.id)
        ]);
        if(mRes.error) throw mRes.error;
        if(pRes.error) throw pRes.error;
        if(tRes.error) throw tRes.error;

        mergeByTimestamp('masters', mRes.data || []);
        mergeByTimestamp('parties', pRes.data || []);
        mergeByTimestamp('transactions', tRes.data || []);
        sbOk = true;
      }
    }

    if(includeGoogleSheets){
      if(!cfg.gsUrl || !cfg.gsUrl.startsWith('https://script.google.com/')){
        throw new Error('Google Apps Script Web App URL सेट नहीं है');
      }
      const payloadRecords = [
        ...store.masters.map(m => ({category: m.master_type, monthly: false, record: m})),
        ...store.parties.map(p => ({category: p.party_type, monthly: false, record: p})),
        ...store.transactions.map(t => ({
          category: t.tx_type, monthly: true,
          record: {...t, summary: `${t.tx_type.toUpperCase()} #${t.tx_number}`, ...(t.payload || {})}
        }))
      ];

      let totalSynced = 0;
      for(let i = 0; i < payloadRecords.length; i += 75){
        const resp = await fetch(cfg.gsUrl, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({token: cfg.gsToken, records: payloadRecords.slice(i, i + 75)})
        });
        if(!resp.ok) throw new Error(`HTTP ${resp.status} from Google Sheets`);
        const data = await resp.json();
        if(!data || !data.ok) throw new Error((data && data.error) || 'Google Sheets Script Error');
        totalSynced += n(data.synced);
      }
      gsOk = true;
      addAudit('GS_SYNC', 'GoogleSheets', 'BATCH', `Google Sheets में ${totalSynced} रिकॉर्ड की वास्तविक पुष्टि हुई`);
    }

    const nowTime = new Date().toLocaleTimeString('hi-IN', {hour:'2-digit', minute:'2-digit'});
    if(sbOk || gsOk){
      cfg.lastSyncStatus = `Synced (${nowTime})`;
    } else if(!authUser){
      cfg.lastSyncStatus = 'Local Mode (Login Required for Cloud)';
    } else if(errMsg){
      cfg.lastSyncStatus = 'Sync Failed: ' + String(errMsg).slice(0, 28);
    } else if(syncQueue.length > 0){
      cfg.lastSyncStatus = 'Pending Queue';
    }
  } catch(e){
    cfg.lastSyncStatus = 'Sync Failed';
    console.error('Sync failure:', e);
    if(includeGoogleSheets){
      alert('❌ Sync विफल: ' + (e && e.message ? e.message : String(e)));
    }
  } finally{
    syncing = false;
    persist();
    if(page === 'cloud') render();
  }
}

function mergeByTimestamp(key, remoteList){
  const map = new Map((store[key] || []).map(x => [x.id, x]));
  (remoteList || []).forEach(rem => {
    if(!rem || !rem.id) return;
    const loc = map.get(rem.id);
    const remTs = new Date(rem.updated_at || rem.created_at || 0).getTime() || 0;
    const locTs = loc ? (new Date(loc.updated_at || loc.created_at || 0).getTime() || 0) : -1;
    if(!loc || remTs >= locTs) map.set(rem.id, rem);
  });
  store[key] = Array.from(map.values());
}

function saveTransaction(tx, isEdit = false){
  if(!isEdit && store.transactions.some(t => t.id === tx.id)){
    alert('Duplicate Transaction ID रोका गया!');
    return false;
  }
  if(isEdit){
    const idx = store.transactions.findIndex(t => t.id === tx.id);
    if(idx !== -1) store.transactions[idx] = tx;
    addAudit('EDIT', tx.tx_type, tx.tx_number, 'रिकॉर्ड संशोधित किया गया (Stock री-कैलकुलेट)');
  } else {
    store.transactions.unshift(tx);
    addAudit('CREATE', tx.tx_type, tx.tx_number, `नया ${tx.tx_type} रिकॉर्ड (${tx.tx_date}) दर्ज`);
  }
  queueUpsert('tx', tx.id, tx);
  runCloudSync(false);
  return true;
}

function toggleCancelTx(id){
  if(!hasPerm('editDel')){ alert('केवल Admin या Accountant ही Cancel/Restore कर सकते हैं।'); return; }
  const tx = store.transactions.find(t => t.id === id);
  if(!tx) return;
  const nextStatus = tx.status === 'active' ? 'cancelled' : 'active';
  const reason = prompt(nextStatus === 'cancelled' ? 'Cancel करने का कारण लिखें:' : 'पुनः सक्रिय करने का कारण:');
  if(!reason) return;
  tx.status = nextStatus;
  tx.updated_at = new Date().toISOString();
  addAudit(nextStatus === 'cancelled' ? 'CANCEL' : 'RESTORE', tx.tx_type, tx.tx_number, reason);
  queueUpsert('tx', tx.id, tx);
  runCloudSync(false);
  render();
}

            </select>
          </div>
          <button id="applyRoleBtn">सेटिंग लागू करें</button>
        </div>
      </div>

      ${hasPerm('users') ? `
      <div class="card"><form id="uForm" class="form">
        <div><label>कर्मचारी का नाम *</label><input name="name" required></div>
        <div><label>ईमेल *</label><input name="email" type="email" required></div>
        <div><label>Role</label><select name="role"><option value="production">Production Operator</option><option value="store">Store Keeper</option><option value="accountant">Accountant</option><option value="admin">Admin</option></select></div>
        <button>यूजर जोड़ें</button>
      </form></div>` : ''}

      <div class="card tablewrap"><table>
        <tr><th>नाम</th><th>ईमेल</th><th>Role</th></tr>
        ${store.users.map(u => `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td><span class="badge b-info">${esc(u.role.toUpperCase())}</span></td></tr>`).join('')}
      </table></div>`;

    $('applyRoleBtn').onclick = () => {
      cfg.activeRole = $('activeRoleSel').value;
      cfg.allowNegativeStockAdmin = cfg.activeRole === 'admin' && $('negStockSel').value === 'true';
      addAudit('ROLE_UPDATE', 'UserManagement', cfg.activeRole, `Role: ${cfg.activeRole}, NegativeStockOverride: ${cfg.allowNegativeStockAdmin}`);
      persist();
      render();
    };
    if($('uForm')){
      $('uForm').onsubmit = e => {
        e.preventDefault();
        const f = new FormData(e.target);
        store.users.push({id:uid(), name:f.get('name').trim(), email:f.get('email').trim(), role:f.get('role')});
        addAudit('ADD_USER', 'UserManagement', f.get('email'), `नया यूजर (${f.get('role')}) जोड़ा गया`);
        persist();
        render();
      };
    }
    return;
  }

  if(page === 'cloud'){
    $('app').innerHTML = `
      <h2>18. Cloud Sync (Supabase + Google Sheets) & Backup</h2>
      <div class="card">
        <h3>Supabase Authentication & Real Queue Sync</h3>
        <div class="form">
          <div><label>Supabase Login Email</label><input id="loginEmail" type="email" value="${esc(authUser?.email||'')}" placeholder="आपका ईमेल"></div>
          <button id="sendOtpBtn">Login Link भेजें</button>
          <button id="syncSbBtn" class="secondary">☁ Sync Now (${syncQueue.length} Pending)</button>
          <button id="signOutBtn" class="secondary">Sign Out</button>
        </div>
        <p class="muted" style="margin-top:8px">स्थिति: <b>${esc(cfg.lastSyncStatus)}</b> | Pending Queue Items: <b>${syncQueue.length}</b></p>
      </div>

      <div class="card">
        <h3>Google Sheets Monthly Auto-Tab Sync</h3>
        <div class="form">
          <div><label>Apps Script Web App URL</label><input id="gsUrlInp" type="url" value="${esc(cfg.gsUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div>
          <div><label>Security Token</label><input id="gsTokInp" value="${esc(cfg.gsToken)}"></div>
          <button id="saveGsCfgBtn">Save Settings</button>
          <button id="pushGsBtn" class="secondary">📊 Sync & Verify Google Sheets</button>
        </div>
      </div>

      <div class="card">
        <h3>Daily & Full JSON Backup / Safe Restore</h3>
        <div class="actions">
          <button onclick="downloadBackup('daily')">📅 Daily Backup डाउनलोड</button>
          <button onclick="downloadBackup('full')" class="secondary">💾 Complete Backup डाउनलोड</button>
          <button id="restBtn" class="secondary">♻ Restore Backup (Merge)</button>
          <input type="file" id="restFile" accept="application/json" style="display:none">
        </div>
      </div>`;

    $('sendOtpBtn').onclick = async () => {
      try{
        await connectSupabase();
        const email = $('loginEmail').value.trim();
        if(!email){ alert('ईमेल दर्ज करें।'); return; }
        const redirect = location.href.startsWith('http') ? location.origin + location.pathname : undefined;
        const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: redirect}});
        if(error) throw error;
        alert('✅ Login Link ईमेल पर भेज दिया गया है।');
      }catch(e){ alert('❌ Login Error: ' + e.message); }
    };
    $('syncSbBtn').onclick = async () => { await connectSupabase(); await runCloudSync(false); render(); };
    $('signOutBtn').onclick = async () => { if(sb) await sb.auth.signOut(); authUser = null; cfg.lastSyncStatus = 'Signed Out'; persist(); render(); };

    $('saveGsCfgBtn').onclick = () => {
      cfg.gsUrl = $('gsUrlInp').value.trim();
      cfg.gsToken = $('gsTokInp').value.trim();
      persist();
      alert('Google Sheets सेटिंग सेव हो गई।');
    };
    $('pushGsBtn').onclick = () => runCloudSync(true);

    $('restBtn').onclick = () => $('restFile').click();
    $('restFile').onchange = async e => {
      const file = e.target.files[0];
      if(!file) return;
      try{
        const parsed = JSON.parse(await file.text());
        const src = parsed.store || parsed;
        if(Array.isArray(src.masters)) mergeByTimestamp('masters', src.masters);
        if(Array.isArray(src.parties)) mergeByTimestamp('parties', src.parties);
        if(Array.isArray(src.transactions)) mergeByTimestamp('transactions', src.transactions);
        addAudit('RESTORE', 'Backup', file.name, 'JSON बैकअप से डेटा मर्ज किया गया');
        persist();
        alert('✅ डेटा सुरक्षित रूप से Restore हो गया।');
        go('dashboard');
      }catch(err){ alert('❌ अमान्य फाइल: ' + err.message); }
    };
    return;
  }

  if(page === 'audit'){
    $('app').innerHTML = `
      <h2>19. System Defaults & Immutable Audit Trail</h2>
      ${hasPerm('settings') ? `
      <div class="card">
        <h3>Default Costing & Tax Parameters</h3>
        <div class="form">
          <div><label>Default Machine Rate ₹/hr</label><input id="defMach" type="number" step=".01" value="${cfg.machineRate}"></div>
          <div><label>Default Interest % वार्षिक</label><input id="defInt" type="number" step=".01" value="${cfg.interestRate}"></div>
          <div><label>Default Interest Days</label><input id="defDays" type="number" value="${cfg.interestDays}"></div>
          <div><label>Default GST %</label><input id="defGst" type="number" step=".01" value="${cfg.gstRate}"></div>
          <button id="saveDefBtn">Defaults सेव करें</button>
        </div>
      </div>` : ''}

      <div class="card tablewrap">
        <h3>Audit Log (हर Create, Edit, Cancel और Sync का रिकॉर्ड)</h3>
        <table>
          <tr><th>समय</th><th>Actor</th><th>Role</th><th>Action</th><th>Module</th><th>Ref ID</th><th>विवरण</th></tr>
          ${store.auditLogs.map(a => `<tr>
            <td>${new Date(a.created_at).toLocaleString('hi-IN')}</td><td>${esc(a.actor_email)}</td>
            <td><span class="badge b-info">${esc(a.actor_role)}</span></td><td><b>${esc(a.action)}</b></td>
            <td>${esc(a.module)}</td><td>${esc(a.tx_id)}</td><td>${esc(a.summary)}</td>
          </tr>`).join('') || '<tr><td colspan="7">कोई लॉग नहीं</td></tr>'}
        </table>
      </div>`;

    if($('saveDefBtn')){
      $('saveDefBtn').onclick = () => {
        cfg.machineRate = n($('defMach').value);
        cfg.interestRate = n($('defInt').value);
        cfg.interestDays = n($('defDays').value);
        cfg.gstRate = n($('defGst').value);
        addAudit('SETTINGS', 'System', 'DEFAULTS', 'Default costing parameters अपडेट किए गए');
        persist();
        alert('Defaults सेव हो गए।');
      };
    }
    return;
  }
}

window.fillMasterForm = id => {
  const it = store.masters.find(m => m.id === id);
  const f = $('mForm');
  if(!it || !f) return;
  f.elements.id.value = it.id;
  f.elements.code.value = it.code || '';
  f.elements.name.value = it.name || '';
  f.elements.category.value = it.category || '';
  f.elements.unit.value = it.unit || 'kg';
  if(f.elements.pouch_wt_g) f.elements.pouch_wt_g.value = it.pouch_wt_g || 0;
  f.elements.gst_rate.value = it.gst_rate ?? 18;
  f.elements.default_rate.value = it.default_rate || 0;
  f.elements.min_stock.value = it.min_stock || 0;
  window.scrollTo({top:0, behavior:'smooth'});
};

window.editSimpleTx = id => {
  const tx = store.transactions.find(t => t.id === id);
  const f = $('purForm');
  if(!tx || !f) return;
  f.elements.edit_id.value = tx.id;
  f.elements.tx_type.value = tx.tx_type;
  f.elements.tx_date.value = tx.tx_date;
  f.elements.tx_number.value = tx.tx_number;
  f.elements.party_name.value = tx.payload.party_name || '';
  f.elements.item_id.value = tx.payload.item_id || '';
  f.elements.qty.value = tx.payload.qty || 0;
  f.elements.rate.value = tx.payload.rate || 0;
  f.elements.gst_rate.value = tx.payload.gst_rate ?? 18;
  window.scrollTo({top:0, behavior:'smooth'});
};

window.editProductionTx = id => {
  const tx = store.transactions.find(t => t.id === id);
  const f = $('prodForm');
  if(!tx || !f) return;
  const p = tx.payload;
  f.elements.edit_id.value = tx.id;
  f.elements.tx_date.value = tx.tx_date;
  f.elements.tx_number.value = tx.tx_number;
  f.elements.product_id.value = p.product_id || '';
  f.elements.estimated_pouches.value = p.estimated_pouches || 0;
  f.elements.actual_pouches.value = p.actual_pouches || 0;
  f.elements.pouch_wt_g.value = p.pouch_wt_g || 0;
  f.elements.other_printing_cost.value = p.other_printing_cost || 0;
  f.elements.labour_hrs.value = p.labour_hrs || 0;
  f.elements.labour_rate.value = p.labour_rate || 0;
  f.elements.mach_hrs.value = p.mach_hrs || 0;
  f.elements.machine_rate.value = p.machine_rate ?? cfg.machineRate;
  f.elements.packing_cost.value = p.packing_cost || 0;
  f.elements.outer_item_id.value = p.outer_item_id || '';
  f.elements.outer_rate.value = p.outer_rate || 0;
  f.elements.bori_item_id.value = p.bori_item_id || '';
  f.elements.bori_rate.value = p.bori_rate || 0;
  f.elements.dengler_cost.value = p.dengler_cost || 0;
  f.elements.marketing_cost.value = p.marketing_cost || 0;
  f.elements.interest_rate.value = p.interest_rate ?? cfg.interestRate;
  f.elements.interest_days.value = p.interest_days ?? cfg.interestDays;
  f.elements.gst_rate.value = p.gst_rate ?? cfg.gstRate;
  f.elements.itc_eligible.value = String(p.itc_eligible !== false);

  $('rawLinesWrap').innerHTML = '';
  (p.raw_lines && p.raw_lines.length ? p.raw_lines : [{}]).forEach(r => window.addRawRow(r));
  $('printLinesWrap').innerHTML = '';
  (p.print_lines && p.print_lines.length ? p.print_lines : [{}]).forEach(pr => window.addPrintRow(pr));
  window.recalcProdForm();
  window.scrollTo({top:0, behavior:'smooth'});
};

window.viewItemMoves = id => {
  const item = buildStockLedger().find(l => l.id === id);
  const box = $('moveHistoryBox');
  if(!item || !box) return;
  box.innerHTML = `<div class="card"><h3>Stock Movement Drilldown: ${esc(item.name)}</h3>
    <div class="tablewrap"><table>
      <tr><th>दिनांक</th><th>Transaction ID</th><th>Voucher</th><th>Type</th><th>Location</th><th>Qty Change</th><th>विवरण</th></tr>
      ${item.movements.map(m => `<tr>
        <td>${esc(m.date)}</td><td><code>${esc(m.tx_id)}</code></td><td><b>${esc(m.tx_number)}</b></td>
        <td>${esc(m.type)}</td><td>${esc(m.location)}</td>
        <td style="color:${m.change>=0?'var(--ok)':'var(--err)'}"><b>${m.change>=0?'+'+m.change:m.change}</b></td>
        <td>${esc(m.label)}</td>
      </tr>`).join('') || '<tr><td colspan="7">कोई मूवमेंट नहीं</td></tr>'}
    </table></div></div>`;
};

window.downloadBackup = mode => {
  const t = today();
  const data = mode === 'daily'
    ? { mode:'daily', date:t, store:{ ...store, transactions: store.transactions.filter(x => x.tx_date === t) } }
    : { mode:'full', exportedAt: new Date().toISOString(), store };
  if(mode === 'daily') cfg.lastDailyBackup = t;
  persist();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
  a.download = `Sadhna-Agro-${mode.toUpperCase()}-${t}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  render();
};

window.toggleCancelTx = toggleCancelTx;

loadStorage();
render();
window.addEventListener('online', () => runCloudSync(false));
window.addEventListener('DOMContentLoaded', async () => {
  try{
    await connectSupabase();
    await runCloudSync(false);
    render();
  }catch(e){ console.warn('Offline startup:', e); }
});
</script>
</body>
</html>
