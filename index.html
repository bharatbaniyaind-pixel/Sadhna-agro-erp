<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10251f">
<title>SURYA SWAD ERP</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#17231e;--mu:#65736c;--bd:#dce5df;--top:#10251f;--nav:#1d352d;--ac:#087f5b;--ac2:#18a878;--red:#b42318;--gold:#b7791f;--ok:#e8f7ef;--shadow:0 3px 14px #10251f0b}
[data-theme="dark"]{--bg:#0b1512;--card:#14231d;--tx:#e5eee9;--mu:#a0b1a8;--bd:#2b4036;--top:#07100d;--nav:#102019;--ac:#16a879;--ac2:#39c995;--red:#ff8278;--gold:#e6b65c;--ok:#123326;--shadow:none}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--top);color:white;padding:13px 16px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:5}
.logo{width:39px;height:39px;border-radius:11px;background:#1aa878;display:grid;place-items:center;font-size:22px}
header b{font-size:17px;letter-spacing:.5px}header small{display:block;color:#b6c9bf;font-size:11px}
.headright{margin-left:auto;display:flex;gap:7px}.headright button{background:#29453a;color:white;border:1px solid #466254;border-radius:8px;padding:8px;font-size:12px}
nav{background:var(--nav);display:flex;gap:7px;padding:9px 10px;overflow:auto;position:sticky;top:65px;z-index:4}
nav button,.tabs button{white-space:nowrap;border:1px solid #40584c;border-radius:8px;background:transparent;color:#f4fff8;padding:9px 12px;font-weight:650;font-size:12px}
nav button.active{background:var(--ac2);color:#06271c;border-color:var(--ac2)}
.tabs{display:flex;gap:7px;overflow:auto;background:var(--bd);padding:8px 10px}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:7px 12px}
.tabs button.active{background:var(--ac);color:white;border-color:var(--ac)}
main{max-width:1200px;margin:auto;padding:14px}.crumb{color:var(--ac);font-size:12px;font-weight:750;margin:2px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin-bottom:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.metric .label{font-size:11px;color:var(--mu);font-weight:750;text-transform:uppercase}.metric .value{font-size:26px;font-weight:850;margin:5px 0}.metric .sub{font-size:12px;color:var(--ac)}
h2{font-size:18px;margin:0 0 13px}h3{font-size:14px;margin:15px 0 8px}.muted{color:var(--mu);font-size:12px;line-height:1.5}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.field label{display:block;font-size:12px;color:var(--mu);font-weight:700;margin:0 0 5px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px;min-width:0}
textarea{min-height:74px;resize:vertical}
button{cursor:pointer}.btn{border:0;background:var(--ac);color:white;padding:10px 14px;border-radius:8px;font-weight:700;font-size:13px;margin:5px 5px 0 0}.btn.secondary{background:var(--nav)}.btn.light{background:var(--bd);color:var(--tx)}.btn.danger{background:#a92b24}.btn.small{padding:6px 9px;font-size:11px}
.actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tablewrap{overflow:auto;margin-top:10px;border:1px solid var(--bd);border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:580px}th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{background:var(--bg);color:var(--mu);font-weight:750}tr:last-child td{border-bottom:0}
.notice{background:var(--ok);border:1px solid var(--ac);border-radius:9px;padding:11px;font-size:13px;line-height:1.6;margin:10px 0}
.warn{color:var(--red);font-weight:750}.pill{display:inline-block;border-radius:20px;padding:3px 8px;background:var(--ok);color:var(--ac);font-size:11px;font-weight:750}
#toast{position:fixed;z-index:20;bottom:20px;left:50%;transform:translateX(-50%);background:#10251f;color:white;padding:10px 15px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}#toast.show{opacity:1}
.empty{padding:18px;text-align:center;color:var(--mu);font-size:13px}
pre.codebox{background:var(--bg);border:1px solid var(--bd);padding:10px;border-radius:8px;font-size:11px;overflow:auto;max-height:220px;user-select:all}
@media(max-width:520px){main{padding:10px}.card{padding:12px}header{top:0}nav{top:65px}.metric .value{font-size:23px}}
</style>
</head>
<body>
<header><div class="logo">🌱</div><div><b>SURYA SWAD</b><small>Manufacturing • Packing • Inventory • Sales ERP</small></div><div class="headright"><button id="syncBtn" title="Sync to Google Sheets">☁ Sync</button><button id="themeBtn">☾</button></div></header>
<nav id="nav"></nav><div class="tabs" id="tabs"></div>
<main><div class="crumb" id="crumb"></div><section id="app"></section></main><div id="toast"></div>
<script>
"use strict";
const KEY="sadhna_erp_v3", NEWKEY="surya_swad_erp_v1", URLKEY="surya_swad_sheet_url";
const $=id=>document.getElementById(id), num=v=>Number(v)||0, today=()=>new Date().toLocaleDateString("en-CA");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"₹"+num(v).toLocaleString("en-IN",{maximumFractionDigits:2});
const qty=v=>num(v).toLocaleString("en-IN",{maximumFractionDigits:3});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const blank=()=>({products:[],raw:[],packing:[],printing:[],parties:[],purchases:[],productions:[],batches:[],sales:[],expenses:[],adjustments:[]});
let db=blank(), page="dashboard", editing=null;
try{
 let saved=localStorage.getItem(NEWKEY);
 if(saved) db={...blank(),...JSON.parse(saved)};
 else {let old=JSON.parse(localStorage.getItem(KEY)||"{}");db={...blank(),products:old.products||[],raw:old.raw||[],packing:old.packing||[],parties:old.parties||[],purchases:old.purchases||[],batches:old.batches||[],sales:old.sales||[],productions:old.dailyProd||[],expenses:[]};}
}catch(e){db=blank()}

async function syncToSheet(silent=false){
 let url=localStorage.getItem(URLKEY);
 if(!url){if(!silent)toast("Pehle Settings > Cloud mein Web App URL save karein.");return;}
 if(!silent)toast("Google Sheets par sync ho raha hai...");
 try{
  await fetch(url,{
   method:"POST",
   mode:"no-cors",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify({action:"sync_all",timestamp:new Date().toISOString(),data:db})
  });
  localStorage.setItem("surya_swad_last_sync",new Date().toLocaleString("en-IN"));
  if(!silent)toast("Google Sheets sync complete ✓");
  if(page==="cloud")render();
 }catch(e){
  if(!silent)toast("Sync error: Internet ya URL check karein.");
 }
}

function save(autoSync=true){
 try{
  localStorage.setItem(NEWKEY,JSON.stringify(db));
  localStorage.setItem(KEY,JSON.stringify({...db,dailyProd:db.productions}));
  if(autoSync && localStorage.getItem(URLKEY)) syncToSheet(true);
  return true;
 }catch(e){toast("Storage full. Backup download karein.");return false}
}
function toast(s){let t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
function fmtDate(d){return esc(d||"")}
function table(headers,rows){if(!rows.length)return '<div class="empty">Abhi koi record nahi hai.</div>';return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>`<th>${x}</th>`).join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>`<td>${x??""}</td>`).join("")+'</tr>').join("")+'</tbody></table></div>'}
function field(id,label,type="text",value="",opts=[]){let control=type==="select"?`<select id="${id}">${opts.map(x=>`<option value="${esc(x)}" ${String(x)===String(value)?"selected":""}>${esc(x)}</option>`).join("")}</select>`:`<input id="${id}" type="${type}" value="${esc(value)}" ${type==="number"?'step="any"':''}>`;return `<div class="field"><label for="${id}">${label}</label>${control}</div>`}
function form(title,fields,submit="Save",cancelLabel="Clear"){return `<div class="card"><h2>${title}</h2><div class="formgrid">${fields.join("")}</div><div class="actions"><button class="btn" id="saveForm">${submit}</button><button class="btn light" id="cancelEdit">${cancelLabel}</button></div></div>`}
const navItems=[["dashboard","Dashboard"],["masters","Masters"],["purchase","Purchase"],["production","Production"],["inventory","Inventory"],["sales","Sales"],["expenses","Expenses"],["reports","Reports / Backup"],["settings","Settings"]];
const tabs={
dashboard:[["dashboard","Overview"]],
masters:[["products","Retail SKU"],["raw","Raw Material"],["packing","Packing Material"],["printing","Printing Material"],["parties","Party Master"]],
purchase:[["purchase","Purchase Entry"],["purchaseHistory","Purchase History"]],
production:[["daily","Daily Production"],["batch","Packing Batch"],["productionHistory","Production History"],["batchHistory","Batch History"]],
inventory:[["stock","Live Stock"],["adjust","Stock Adjustment"]],
sales:[["sale","Sales / Dispatch"],["salesHistory","Sales History"]],
expenses:[["expense","Other Expenses"],["expenseHistory","Expense History"]],
reports:[["report","Monthly Report"],["export","Excel / CSV Export"],["backup","Backup / Restore"]],
settings:[["settings","Company & Rules"],["cloud","Cloud / Sheets Setup"]]
};
const titleMap=Object.fromEntries(Object.values(tabs).flat());
function byName(arr,name){return arr.find(x=>x.name.toLowerCase()===String(name).toLowerCase())}
function finishedStock(){let m={};db.batches.forEach(b=>m[b.product]=(m[b.product]||0)+num(b.pouches));db.sales.forEach(s=>m[s.product]=(m[s.product]||0)-num(s.pouches));return m}
function purchaseRate(name){for(let i=db.purchases.length-1;i>=0;i--)if(db.purchases[i].material===name)return num(db.purchases[i].rate);return 0}
function stockArray(category){return category==="Raw Material"?db.raw:category==="Printing Material"?db.printing:db.packing}
function addStock(category,name,amount,unit){let arr=stockArray(category);let x=byName(arr,name);if(x)x.qty=num(x.qty)+amount;else arr.push({id:uid(),name,qty:amount,unit:unit||"kg"})}
function metric(label,value,sub){return `<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub||""}</div></div>`}
function dashboard(){let raw=db.raw.reduce((a,x)=>a+num(x.qty),0),pouches=Object.values(finishedStock()).reduce((a,b)=>a+b,0),sales=db.sales.reduce((a,s)=>a+num(s.pouches)*num(s.rate),0),low=[...db.raw,...db.packing,...db.printing].filter(x=>num(x.qty)<5);return `<div class="grid">${metric("Active Retail SKUs",db.products.length,"Product master")}${metric("Raw Material Stock",qty(raw)+" kg","All raw material")}${metric("Packed Pouches",qty(db.batches.reduce((a,b)=>a+num(b.pouches),0)),"Lifetime packed")}${metric("Finished Stock",qty(pouches),"Packed minus sold")}${metric("Sales Value",money(sales),db.sales.length+" dispatch entries")}${metric("Production Batches",db.batches.length,"Batch records")}</div><div class="card"><h2>Stock Alerts</h2>${low.length?'<div class="notice"><span class="warn">Low stock:</span> '+low.map(x=>esc(x.name)+" ("+qty(x.qty)+" "+esc(x.unit||"kg")+")").join(", ")+'</div>':'<div class="notice">No low-stock items (threshold 5 units).</div>'}<p class="muted">Packing rule: 36 pouches = 1 packet • 20 packets = 1 bag • 720 pouches = 1 bag. Machine cost default ₹120/hour.</p></div><div class="card"><h2>Recent Activity</h2>${table(["Date","Activity","Detail"],[...db.purchases.slice(-4).map(x=>[fmtDate(x.date),"Purchase",esc(x.material)+" • "+qty(x.qty)]),...db.batches.slice(-4).map(x=>[fmtDate(x.date),"Production",esc(x.product)+" • "+qty(x.pouches)+" pouches"]),...db.sales.slice(-4).map(x=>[fmtDate(x.date),"Sale",esc(x.product)+" • "+qty(x.pouches)+" pouches"])].slice(-8).reverse())}</div>`}
function masterPage(kind){let cfg={
products:{arr:"products",title:"Retail Product / SKU Master",fields:[field("name","Product Name (e.g. Jeera 15g)"),field("weight","Net Weight per Pouch (g)","number"),field("mrp","MRP (₹)","number")],cols:["Product","Weight","MRP"]},
raw:{arr:"raw",title:"Raw Material Master",fields:[field("name","Material Name"),field("unit","Unit","select","kg",["kg","quintal","pcs","litre"]),field("qty","Opening Stock","number")],cols:["Material","Unit","Stock"]},
packing:{arr:"packing",title:"Packing Material Master",fields:[field("name","Material Name"),field("unit","Unit","select","pcs",["pcs","kg","roll","box"]),field("qty","Opening Stock","number")],cols:["Material","Unit","Stock"]},
printing:{arr:"printing",title:"Printing Material Master",fields:[field("name","Printing Item / Roll / Ink"),field("unit","Unit","select","kg",["kg","roll","pcs"]),field("qty","Opening Stock","number")],cols:["Printing Item","Unit","Stock"]},
parties:{arr:"parties",title:"Supplier / Customer Master",fields:[field("name","Party Name"),field("city","City / Mandi"),field("phone","Mobile (optional)")],cols:["Party","City","Mobile"]}
}[kind],arr=db[cfg.arr],edit=editing&&editing.kind===kind?arr.find(x=>x.id===editing.id):null;
let rows=arr.map(x=>[esc(x.name),kind==="products"?qty(x.weight)+" g":kind==="parties"?esc(x.city||""):esc(x.unit||"kg"),kind==="products"?money(x.mrp):kind==="parties"?esc(x.phone||""):qty(x.qty),`<button class="btn small light" data-edit="${kind}:${x.id}">Edit</button><button class="btn small danger" data-delete="${kind}:${x.id}">Delete</button>`]);
return form(cfg.title,cfg.fields,edit?"Update":"Save",edit?"Cancel Edit":"Clear")+"<div class=card><h2>Saved Records</h2>"+table([...cfg.cols,"Stock / Action"],rows)+"</div>"}
function purchasePage(){
 let edit=editing&&editing.kind==="purchases"?db.purchases.find(x=>x.id===editing.id):null;
 return form(
  edit?"Edit Purchase / Inward Entry":"Purchase / Inward Entry",
  [
   field("date","Date","date",edit?edit.date:today()),
   field("bill","Bill / Lot No.","text",edit?(edit.bill||""):""),
   field("party","Supplier / Party","text",edit?(edit.party||""):""),
   field("category","Category","select",edit?edit.category:"Raw Material",["Raw Material","Packing Material","Printing Material"]),
   field("material","Item Name","text",edit?edit.material:""),
   field("unit","Unit","select",edit?(edit.unit||"kg"):"kg",["kg","pcs","roll","box","litre"]),
   field("qty","Quantity","number",edit?edit.qty:""),
   field("rate","Rate per Unit (₹)","number",edit?edit.rate:""),
   field("billPhoto","Bill Photo (optional)","file")
  ],
  edit?"Update Purchase":"Save",
  edit?"Cancel Edit":"Clear"
 );
}
function productionPage(){return form("Daily Production — Cleaning / Grading / Roasting",[field("date","Date","date",today()),field("rawName","Raw Material"),field("inputQty","Input Qty (kg)","number"),field("outputQty","Clean Output Qty (kg)","number"),field("operator","Operator / Shift"),field("note","Process Note")])}
function batchPage(){return form("Packing Batch — Pouch Filling",[field("date","Date","date",today()),field("batchNo","Batch No."),field("product","Retail Product / SKU"),field("rawName","Raw Material Used"),field("rawUsed","Raw Consumed (kg)","number"),field("pouches","Actual Pouches Packed","number"),field("laminateName","Laminate / Packing Material"),field("laminateQty","Laminate Used (unit)","number"),field("printingName","Printing Material Used"),field("printingQty","Printing Material Used (unit)","number"),field("pouchWeight","Actual Pouch Weight (g)","number"),field("machineHours","Machine Running Hours","number"),field("laborCost","Labour Cost (₹)","number"),field("otherCost","Other Variable Cost (₹)","number"),field("printingCost","Printing Expense (₹)","number"),field("note","Remarks")])}
function salePage(){return form("Sales / Dispatch Entry",[field("date","Date","date",today()),field("party","Customer / Party"),field("product","Product / SKU"),field("pouches","Pouches Sold","number"),field("rate","Rate per Pouch (₹)","number"),field("transport","Transport / Dispatch Cost (₹)","number"),field("note","Invoice / Remarks")])}
function expensePage(){return form("Other Business Expense",[field("date","Date","date",today()),field("category","Expense Head","select","Freight",["Freight","Rent","Electricity","Repair","Salary","Office","Other"]),field("detail","Description"),field("amount","Amount (₹)","number"),field("party","Paid To")])}
function adjustmentPage(){return form("Inventory Stock Adjustment",[field("date","Date","date",today()),field("category","Stock Category","select","Raw Material",["Raw Material","Packing Material","Printing Material"]),field("item","Item Name"),field("direction","Adjustment","select","Add",["Add","Reduce"]),field("qty","Quantity","number"),field("reason","Reason")])}
function stockPage(){let rows=[];[["Raw Material",db.raw],["Packing Material",db.packing],["Printing Material",db.printing]].forEach(([cat,a])=>a.forEach(x=>rows.push([cat,esc(x.name),qty(x.qty),esc(x.unit||"kg"),num(x.qty)<5?'<span class="warn">LOW</span>':'OK'])));let fm=finishedStock();return `<div class=card><h2>Live Inventory</h2>${table(["Category","Item","Available","Unit","Status"],rows)}</div><div class=card><h2>Finished Pouch Stock</h2>${table(["Product","Pouches","Packets (36)","Bags (720)","Loose Pouches"],Object.entries(fm).map(([k,v])=>[esc(k),qty(v),qty(Math.floor(v/36)),qty(Math.floor(v/720)),qty(v%720)]))}</div>`}
function historyPage(type){
 let arr=type==="purchase"?db.purchases:type==="production"?db.productions:type==="batch"?db.batches:type==="sales"?db.sales:db.expenses;
 let rows=arr.slice().reverse().map(x=>
  type==="purchase"?[fmtDate(x.date),esc(x.bill||""),esc(x.party||""),esc(x.category),esc(x.material),qty(x.qty)+" "+esc(x.unit||""),money(x.rate),money(num(x.qty)*num(x.rate)),`<button class="btn small light" data-edit="purchases:${x.id}">Edit</button><button class="btn small danger" data-delete="purchases:${x.id}">Delete</button>`]:
  type==="production"?[fmtDate(x.date),esc(x.rawName),qty(x.inputQty),qty(x.outputQty),qty(x.lossPct)+"%",esc(x.operator||"")]:
  type==="batch"?[fmtDate(x.date),esc(x.batchNo),esc(x.product),qty(x.pouches),money(x.totalCost),money(x.costPerPouch)]:
  type==="sales"?[fmtDate(x.date),esc(x.party),esc(x.product),qty(x.pouches),money(x.rate),money(x.pouches*x.rate)]:
  [fmtDate(x.date),esc(x.category),esc(x.detail),money(x.amount),esc(x.party||"")]
 );
 let heads=
  type==="purchase"?["Date","Bill","Party","Category","Item","Qty","Rate","Total","Action"]:
  type==="production"?["Date","Raw Material","Input kg","Output kg","Loss %","Operator"]:
  type==="batch"?["Date","Batch","Product","Pouches","Batch Cost","Cost/Pouch"]:
  type==="sales"?["Date","Customer","Product","Pouches","Rate","Total"]:
  ["Date","Head","Detail","Amount","Paid To"];
 return `<div class=card><h2>${type[0].toUpperCase()+type.slice(1)} History</h2>${table(heads,rows)}</div>`;
}
function reportPage(){let month=$("monthFilter")?.value||today().slice(0,7),inMonth=x=>(x.date||"").slice(0,7)===month,ps=db.purchases.filter(inMonth),bs=db.batches.filter(inMonth),ss=db.sales.filter(inMonth),es=db.expenses.filter(inMonth);let buy=ps.reduce((a,x)=>a+x.qty*x.rate,0),cost=bs.reduce((a,x)=>a+x.totalCost,0),rev=ss.reduce((a,x)=>a+x.pouches*x.rate,0),exp=es.reduce((a,x)=>a+x.amount,0);return `<div class=card><h2>Monthly Business Report</h2><div class=formgrid>${field("monthFilter","Select Month","month",month)}</div><div class=grid style="margin-top:12px">${metric("Purchase Value",money(buy),ps.length+" entries")}${metric("Production Cost",money(cost),bs.length+" batches")}${metric("Sales Value",money(rev),ss.length+" dispatches")}${metric("Other Expenses",money(exp),es.length+" entries")}${metric("Gross Difference",money(rev-cost-exp),"Sales − production cost − expenses")}</div><h3>Monthly Production</h3>${table(["Date","Batch","Product","Pouches","Cost/Pouch"],bs.map(x=>[fmtDate(x.date),esc(x.batchNo),esc(x.product),qty(x.pouches),money(x.costPerPouch)]))}<h3>Monthly Sales</h3>${table(["Date","Party","Product","Pouches","Amount"],ss.map(x=>[fmtDate(x.date),esc(x.party),esc(x.product),qty(x.pouches),money(x.pouches*x.rate)]))}</div>`}
function exportPage(){return `<div class=card><h2>Excel / CSV Export</h2><p class=muted>Har section ki alag CSV file download hogi. CSV Microsoft Excel mein khulti hai.</p><div class=actions>${["products","raw","packing","printing","parties","purchases","productions","batches","sales","expenses","adjustments"].map(k=>`<button class="btn" data-export="${k}">${k} CSV</button>`).join("")}<button class="btn secondary" id="allExport">Complete ERP CSV</button></div></div>`}
function backupPage(){return `<div class=card><h2>Backup & Restore</h2><p class=muted>Backup ko phone ke Downloads folder mein rakhein. Restore karne se current data replace hoga.</p><button class="btn" id="backupDownload">Download Full JSON Backup</button><div class=field style="margin-top:16px"><label>Restore JSON Backup</label><input type=file id=restoreFile accept=".json,application/json"></div><button class="btn danger" id="restoreBtn">Restore Backup</button></div>`}
function settingsPage(){return `<div class=card><h2>Company & Packing Rules</h2><div class=notice><b>Company:</b> SURYA SWAD<br><b>1 Packet:</b> 36 pouches<br><b>1 Bag:</b> 20 packets = 720 pouches<br><b>Outer Panni:</b> 1 per 36 pouches<br><b>LD Outer Panni:</b> 1 per packet<br><b>Machine Cost:</b> ₹120 per machine-hour</div><p class=muted>These rules are shown as the standard costing assumptions. Actual material consumption and costs are entered batch-wise.</p><button class=btn id=themeToggle>Toggle Dark / Light Theme</button></div>`}

const appsScriptCode = `function doPost(e) {
  try {
    var payload = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var db = payload.data || {};
    var sections = ["products","raw","packing","printing","parties","purchases","productions","batches","sales","expenses","adjustments"];
    
    sections.forEach(function(sec) {
      var rows = db[sec] || [];
      var sheet = ss.getSheetByName(sec) || ss.insertSheet(sec);
      sheet.clearContents();
      if (rows.length > 0) {
        var headers = Object.keys(rows[0]);
        var grid = [headers];
        rows.forEach(function(item) {
          grid.push(headers.map(function(h) { return item[h] !== undefined ? item[h] : ""; }));
        });
        sheet.getRange(1, 1, grid.length, headers.length).setValues(grid);
      }
    });
    return ContentService.createTextOutput(JSON.stringify({status: "ok"})).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({status: "error", message: err.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}`;

function cloudPage(){
 let savedUrl = localStorage.getItem(URLKEY) || "";
 let lastSync = localStorage.getItem("surya_swad_last_sync") || "Abhi tak sync nahi hua";
 let statusHtml = savedUrl 
  ? `<div class="notice"><b>Status:</b> Google Sheets Sync Connected ✓<br><small>Last Sync: ${esc(lastSync)}</small></div>`
  : `<div class="notice"><span class="warn">Status:</span> Google Sheets configure nahi hai (Offline Mode). Niche diye gaye 3 steps follow karke connect karein:</div>`;

 return `<div class=card>
  <h2>Google Sheets Auto-Sync Setup</h2>
  ${statusHtml}
  ${field("sheetUrl","Google Apps Script Web App URL","text",savedUrl)}
  <div class="actions">
   <button class="btn" id="saveCloud">Save & Connect</button>
   ${savedUrl ? `<button class="btn secondary" id="manualSyncBtn">Sync Now ☁</button><button class="btn danger" id="disconnectCloud">Disconnect</button>` : ``}
  </div>
  <h3>Setup Kaise Karein (Sirf 2 Minute):</h3>
  <ol class="muted" style="padding-left:18px;line-height:1.7">
   <li>Apne Google Drive mein ek nayi <b>Google Sheet</b> banayein (e.g. <i>Surya Swad ERP Data</i>).</li>
   <li>Sheet ke upar menu mein <b>Extensions &gt; Apps Script</b> par click karein.</li>
   <li>Purana code hatakar niche diya gaya code paste karein aur Save (💾) karein:</li>
  </ol>
  <button class="btn small light" id="copyScriptBtn">📋 Copy Apps Script Code</button>
  <pre class="codebox" id="scriptCodeBox">${esc(appsScriptCode)}</pre>
  <ol class="muted" start="4" style="padding-left:18px;line-height:1.7">
   <li>Upar <b>Deploy &gt; New deployment</b> par click karein.</li>
   <li>Select type mein <b>Web app</b> chunein.</li>
   <li><i>Execute as:</i> <b>Me</b> aur <i>Who has access:</i> <b>Anyone</b> select karke <b>Deploy</b> karein (Permission allow karein).</li>
   <li>Jo <b>Web App URL</b> milega, use upar box mein paste karke <b>Save &amp; Connect</b> daba dein.</li>
  </ol>
 </div>`;
}

function render(){let group=Object.keys(tabs).find(g=>tabs[g].some(x=>x[0]===page))||"dashboard";$("nav").innerHTML=navItems.map(([id,label])=>`<button data-group="${id}" class="${id===group?"active":""}">${label}</button>`).join("");$("tabs").innerHTML=(tabs[group]||[]).map(([id,label])=>`<button data-page="${id}" class="${id===page?"active":""}">${label}</button>`).join("");$("crumb").textContent="SURYA SWAD  /  "+(titleMap[page]||"Dashboard");
let view="";
if(page==="dashboard")view=dashboard();
else if(["products","raw","packing","printing","parties"].includes(page))view=masterPage(page);
else if(page==="purchase")view=purchasePage();
else if(page==="production")view=productionPage();
else if(page==="batch")view=batchPage();
else if(page==="sale")view=salePage();
else if(page==="expense")view=expensePage();
else if(page==="adjust")view=adjustmentPage();
else if(page==="stock")view=stockPage();
else if(page==="purchaseHistory")view=historyPage("purchase");
else if(page==="productionHistory")view=historyPage("production");
else if(page==="batchHistory")view=historyPage("batch");
else if(page==="salesHistory")view=historyPage("sales");
else if(page==="expenseHistory")view=historyPage("expense");
else if(page==="report")view=reportPage();
else if(page==="export")view=exportPage();
else if(page==="backup")view=backupPage();
else if(page==="settings")view=settingsPage();
else if(page==="cloud")view=cloudPage();
$("app").innerHTML=view;
}
function val(id){let e=$(id);return e?e.value.trim():""}
function get(id){let e=$(id);return e?e.value:""}
function number(id){return num(get(id))}
function handleSave(){
 if(["products","raw","packing","printing","parties"].includes(page)){
  let arr=db[page],name=val("name");if(!name)return toast("Name enter karein");
  let data={name};if(page==="products")Object.assign(data,{weight:number("weight"),mrp:number("mrp")});
  else if(page==="parties")Object.assign(data,{city:val("city"),phone:val("phone")});
  else Object.assign(data,{unit:get("unit")||"kg",qty:number("qty")});
  if(editing&&editing.kind===page){let old=arr.find(x=>x.id===editing.id);if(old)Object.assign(old,data);editing=null}
  else {if(arr.some(x=>x.name.toLowerCase()===name.toLowerCase()))return toast("Ye naam pehle se hai");arr.push({id:uid(),...data})}
 }else if(page==="purchase"){
  let category=get("category"),material=val("material"),q=number("qty"),unit=get("unit");
  if(!material||q<=0)return toast("Item aur valid quantity zaroori hai");
  let file=$("billPhoto").files[0];if(file){if(file.size>1500000)return toast("Photo 1.5 MB se chhoti rakhein");}
  let newEntry={date:get("date")||today(),bill:val("bill"),party:val("party")||"Cash / Mandi",category,material,unit,qty:q,rate:number("rate")};
  if(editing&&editing.kind==="purchases"){
   let old=db.purchases.find(x=>x.id===editing.id);
   if(old){
    let oldStock=byName(stockArray(old.category),old.material);
    let oldQ=num(old.qty);
    let sameItem=old.category===category && old.material.toLowerCase()===material.toLowerCase();
    if(sameItem){
     if(oldStock && num(oldStock.qty)-oldQ+q<0)return toast("Stock kam hai, itna reduce nahi kar sakte");
     addStock(category,material,q-oldQ,unit);
    }else{
     if(oldStock && num(oldStock.qty)<oldQ)return toast("Purane item ka stock pehle hi use ho chuka hai");
     if(oldStock)oldStock.qty=num(oldStock.qty)-oldQ;
     addStock(category,material,q,unit);
    }
    Object.assign(old,newEntry);
   }
   editing=null;
   save();toast("Purchase updated ✓");page="purchaseHistory";render();return;
  }else{
   db.purchases.push({id:uid(),...newEntry});
   addStock(category,material,q,unit);
  }
 }else if(page==="production"){
  let raw=val("rawName"),i=number("inputQty"),o=number("outputQty"),stock=byName(db.raw,raw);if(!raw||i<=0||o<0||o>i)return toast("Material aur valid input/output bharein");if(!stock||stock.qty<i)return toast("Raw material stock kam hai");
  stock.qty-=i;let loss=i?((i-o)/i*100):0;db.productions.push({id:uid(),date:get("date")||today(),rawName:raw,inputQty:i,outputQty:o,lossPct:loss,operator:val("operator"),note:val("note")});
  stock.qty+=o;
 }else if(page==="batch"){
  let product=val("product"),raw=val("rawName"),used=number("rawUsed"),pouches=Math.round(number("pouches"));if(!product||pouches<=0)return toast("Product aur actual pouches bharein");
  let rawItem=byName(db.raw,raw);if(used>0&&(!rawItem||rawItem.qty<used))return toast("Raw material stock kam hai");
  let lamName=val("laminateName"),lamQty=number("laminateQty"),lam=byName(db.packing,lamName);if(lamQty>0&&(!lam||lam.qty<lamQty))return toast("Packing material stock kam hai");
  let printName=val("printingName"),printQty=number("printingQty"),pr=byName(db.printing,printName);if(printQty>0&&(!pr||pr.qty<printQty))return toast("Printing material stock kam hai");
  let hours=number("machineHours"),machine=hours*120,rawCost=used*purchaseRate(raw),packCost=lamQty*purchaseRate(lamName),printMaterialCost=printQty*purchaseRate(printName),labor=number("laborCost"),other=number("otherCost"),printingCost=number("printingCost");
  if(rawItem&&used)rawItem.qty-=used;if(lam&&lamQty)lam.qty-=lamQty;if(pr&&printQty)pr.qty-=printQty;
  let total=rawCost+packCost+printMaterialCost+machine+labor+other+printingCost;
  let prod=db.products.find(x=>x.name===product)||{};
  db.batches.push({id:uid(),date:get("date")||today(),batchNo:val("batchNo")||"SS-"+(db.batches.length+1),product,rawName:raw,rawUsed:used,pouches,packetCount:Math.ceil(pouches/36),bagCount:Math.floor(pouches/720),outerPanni:Math.ceil(pouches/36),ldOuterPanni:Math.ceil(pouches/36),laminateName:lamName,laminateQty:lamQty,printingName:printName,printingQty:printQty,pouchWeight:number("pouchWeight")||num(prod.weight),machineHours:hours,machineCost:machine,laborCost:labor,otherCost:other,printingCost,totalCost:total,costPerPouch:total/pouches,note:val("note")});
 }else if(page==="sale"){
  let product=val("product"),p=Math.round(number("pouches")),av=finishedStock()[product]||0;if(!product||p<=0||p>av)return toast("Product / quantity check karein. Available: "+av);
  db.sales.push({id:uid(),date:get("date")||today(),party:val("party")||"Cash",product,pouches:p,rate:number("rate"),transport:number("transport"),note:val("note")});
 }else if(page==="expense"){
  let amount=number("amount");if(amount<=0)return toast("Valid amount enter karein");db.expenses.push({id:uid(),date:get("date")||today(),category:get("category"),detail:val("detail"),amount,party:val("party")});
 }else if(page==="adjust"){
  let cat=get("category"),name=val("item"),q=number("qty");if(!name||q<=0)return toast("Item aur quantity enter karein");let arr=cat==="Raw Material"?db.raw:cat==="Printing Material"?db.printing:db.packing,x=byName(arr,name);if(!x)return toast("Item master mein nahi mila");if(get("direction")==="Reduce"&&x.qty<q)return toast("Stock se zyada reduce nahi kar sakte");x.qty+=get("direction")==="Add"?q:-q;db.adjustments.push({id:uid(),date:get("date")||today(),category:cat,item:name,direction:get("direction"),qty:q,reason:val("reason")});
 }
 save();toast("Saved ✓");render();
}
function download(content,name,type){let a=document.createElement("a"),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(rows){return "\ufeff"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n")}
function exportData(k){let a=db[k]||[];let keys=a.length?Object.keys(a[0]):[];download(csv([keys,...a.map(x=>keys.map(k=>typeof x[k]==="object"?JSON.stringify(x[k]):x[k]))]),"surya_swad_"+k+".csv","text/csv;charset=utf-8");}
$("nav").addEventListener("click",e=>{let g=e.target.dataset.group;if(g){page=tabs[g][0][0];editing=null;render()}});
$("tabs").addEventListener("click",e=>{let p=e.target.dataset.page;if(p){page=p;editing=null;render()}});
$("app").addEventListener("click",e=>{
 if(e.target.id==="saveForm"){handleSave();return}
 if(e.target.id==="cancelEdit"){let wasPurchaseEdit=editing&&editing.kind==="purchases";editing=null;if(wasPurchaseEdit)page="purchaseHistory";render();return}
 if(e.target.dataset.edit){
  let [kind,id]=e.target.dataset.edit.split(":");
  let x=db[kind]?.find(y=>y.id===id);
  if(!x)return;
  editing={kind,id};
  if(kind==="purchases"){page="purchase";render();return}
  render();
  let vals=kind==="products"?["name","weight","mrp"]:kind==="parties"?["name","city","phone"]:["name","unit","qty"];
  vals.forEach(k=>{let el=$(k);if(el)el.value=x[k]??""});
  $("saveForm").textContent="Update";
  return;
 }
 if(e.target.dataset.delete){
  let [kind,id]=e.target.dataset.delete.split(":");
  if(!confirm("Is record ko delete karein?"))return;
  if(kind==="purchases"){
   let p=db.purchases.find(x=>x.id===id);
   if(p){
    let st=byName(stockArray(p.category),p.material);
    if(st && num(st.qty)<num(p.qty))return toast("Stock pehle hi use ho chuka hai, delete nahi kar sakte");
    if(st)st.qty=num(st.qty)-num(p.qty);
   }
  }
  db[kind]=db[kind].filter(x=>x.id!==id);
  save();render();toast("Deleted");return;
 }
 if(e.target.dataset.export){exportData(e.target.dataset.export);return}
 if(e.target.id==="allExport"){let rows=[["Section","Record JSON"]];Object.entries(db).forEach(([k,a])=>a.forEach(x=>rows.push([k,JSON.stringify(x)])));download(csv(rows),"surya_swad_complete_export.csv","text/csv;charset=utf-8");return}
 if(e.target.id==="backupDownload"){download(JSON.stringify(db,null,2),"surya_swad_backup_"+today()+".json","application/json");return}
 if(e.target.id==="restoreBtn"){let f=$("restoreFile").files[0];if(!f)return toast("Backup file select karein");let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=="object")throw 0;db={...blank(),...x};save();render();toast("Backup restored ✓")}catch(e){toast("Invalid backup file")}};r.readAsText(f);return}
 if(e.target.id==="themeToggle"){document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";return}
 if(e.target.id==="saveCloud"){
  let u=val("sheetUrl");
  if(!u||!u.startsWith("https://script.google.com/"))return toast("Valid Google Apps Script URL paste karein");
  localStorage.setItem(URLKEY,u);
  syncToSheet(false);
  return;
 }
 if(e.target.id==="manualSyncBtn"){syncToSheet(false);return}
 if(e.target.id==="disconnectCloud"){localStorage.removeItem(URLKEY);localStorage.removeItem("surya_swad_last_sync");toast("Disconnected");render();return}
 if(e.target.id==="copyScriptBtn"){navigator.clipboard.writeText(appsScriptCode).then(()=>toast("Apps Script code copied ✓")).catch(()=>toast("Code box se manually copy karein"));return}
});
$("app").addEventListener("change",e=>{if(e.target.id==="monthFilter")render()});
$("themeBtn").onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark"};
$("syncBtn").onclick=()=>{if(localStorage.getItem(URLKEY))syncToSheet(false);else{page="cloud";render();}};
render();
</script>
