<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surya Swad ERP</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--top:#0f172a;--nav:#1e293b;--ac:#059669;--ac2:#10b981;--warn:#b91c1c;--ok:#ecfdf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#162033;--tx:#e5edf7;--mu:#94a3b8;--bd:#2b3a52;--top:#060b14;--nav:#111b2c;--ok:#0d2a22;--warn:#f87171}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#162033;--tx:#e5edf7;--mu:#94a3b8;--bd:#2b3a52;--top:#060b14;--nav:#111b2c;--ok:#0d2a22;--warn:#f87171}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
.top{background:var(--top);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.ic{width:36px;height:36px;background:var(--ac2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px}
.top b{font-size:16px;display:block}.top small{font-size:11px;color:#94a3b8}
.nav,.sub{display:flex;gap:8px;overflow-x:auto;padding:8px 12px}
.nav{background:var(--nav)}.sub{background:var(--bd)}
.nav button{background:var(--top);color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.nav button.on{background:var(--ac2);color:#06281d;border-color:var(--ac2)}
.sub button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.sub button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:16px;max-width:1100px;margin:0 auto}
.bc{font-size:13px;color:var(--ac);font-weight:600;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
h2{font-size:18px;margin-bottom:14px}h3{font-size:15px;margin:14px 0 6px}
.k{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase}.kv{font-size:28px;font-weight:800;margin:6px 0}.ks{font-size:13px;color:var(--ac)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--mu)}
.fg{margin-bottom:12px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;font-size:14px;background:var(--bg);color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:600;width:100%;margin-top:4px}
.btn.s{background:var(--nav);margin-top:8px}
.tw{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu)}
.res{background:var(--ok);border:1px solid var(--ac);border-radius:8px;padding:12px;margin-top:12px;font-size:14px;line-height:1.7}
.low{color:var(--warn);font-weight:700}
.ab{background:var(--nav);color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:12px;margin-right:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90%}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="ic">🌱</div><div><b>SURYA SWAD</b><small>Manufacturing, Packing & Sales Suite</small></div></header>
<div class="nav" id="nav"></div>
<div class="sub" id="sub" hidden></div>
<main><div class="bc" id="bc"></div><div id="view"></div></main>
<div id="toast"></div>
<div id="lb" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;align-items:center;justify-content:center;padding:16px"></div>
<script>
const KEY="sadhna_erp_v3",LOW=5;
const L=["products","raw","packing","parties","purchases","dailyProd","batches","sales"];
let db={};
try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){db={}}
L.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id),today=new Date().toISOString().slice(0,10);
const n=v=>Number(v)||0,f=(v,d=2)=>n(v).toFixed(d).replace(/\.00$/,"");
const same=(a,b)=>String(a).toLowerCase()===String(b).toLowerCase();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Storage full! Backup download karo, purani photos hatao")}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function fld(a){return a.map(([id,l,t,o])=>`<div class="fg"><label>${l}</label>${t==="select"?`<select id="${id}">${o.map(x=>`<option>${E(x)}</option>`).join("")}</select>`:`<input id="${id}" type="${t||"text"}" ${t==="file"?'accept="image/*"':'step="any"'} ${o?`list="${o}"`:""} ${t==="date"?`value="${today}"`:""}>`}</div>`).join("")}
function tbl(h,r){return `<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
const dls=()=>[["dlP",db.parties.map(x=>x.name)],["dlR",db.raw.map(x=>x.name)],["dlS",db.products.map(x=>x.name)],["dlI",db.raw.concat(db.packing).map(x=>x.name)]].map(([i,a])=>`<datalist id="${i}">${a.map(x=>`<option value="${E(x)}">`).join("")}</datalist>`).join("");
const val=id=>$(id).value.trim();
function finished(){const m={};db.batches.forEach(b=>m[b.product]=(m[b.product]||0)+n(b.pouches));db.sales.forEach(s=>m[s.product]=(m[s.product]||0)-n(s.pouches));return m}
function form(title,fields,btn,tableHtml){return `<div class="card"><h2>${title}</h2>${fld(fields)}<button class="btn" id="go">${btn}</button>${tableHtml||""}</div>${dls()}`}

const P={
dashboard(){const fm=finished(),tp=Object.values(fm).reduce((a,b)=>a+b,0),rev=db.sales.reduce((a,s)=>a+n(s.pouches)*n(s.rate),0),low=db.raw.filter(r=>n(r.qty)<LOW);
return `<div class="card"><div class="k">Total SKUs</div><div class="kv">${db.products.length}</div><div class="ks">Active retail pouches</div></div>
<div class="card"><div class="k">Raw material stock</div><div class="kv">${f(db.raw.reduce((a,r)=>a+n(r.qty),0))} kg</div><div class="ks">${low.length?`<span class="low">Low: ${low.map(r=>E(r.name)).join(", ")}</span>`:"All lots above "+LOW+" kg"}</div></div>
<div class="card"><div class="k">Packing batches</div><div class="kv">${db.batches.length}</div><div class="ks">${db.batches.reduce((a,b)=>a+n(b.pouches),0)} pouches packed, ${tp} in stock</div></div>
<div class="card"><div class="k">Total sales</div><div class="kv">₹${f(rev)}</div><div class="ks">${db.sales.length} dispatch entries</div></div>`},
product:{save(){const name=val("a");if(!name)return"Enter product name";if(ED){Object.assign(db.products[ED.i],{name,weight:val("b"),mrp:val("c")});ED=null;return}db.products.push({name,weight:val("b"),mrp:val("c")})},
 html:()=>form("Product Master (Retail SKUs)",[["a","Product Name (e.g. Jeera 15g Pouch)"],["b","Pack Weight (g)","number"],["c","MRP (₹)","number"]],"+ Save Product",tbl(["Product","Weight","MRP",""],db.products.map((p,i)=>[E(p.name),E(p.weight)+"g","₹"+E(p.mrp),act("product",i)])))},
raw:{save(){const name=val("a");if(!name)return"Enter name";const q=n(val("b"));if(ED){Object.assign(db.raw[ED.i],{name,qty:q});ED=null;return}const e=db.raw.find(r=>same(r.name,name));e?e.qty=n(e.qty)+q:db.raw.push({name,qty:q})},
 html:()=>form("Raw Material Master",[["a","Raw Material (Jeera / Haldi / Makhana)"],["b","Opening Stock (kg)","number"]],"+ Save Raw Material",tbl(["Material","Stock",""],db.raw.map((r,i)=>[E(r.name),f(r.qty)+" kg",act("raw",i)])))},
packing:{save(){const name=val("a");if(!name)return"Enter item name";if(ED){Object.assign(db.packing[ED.i],{name,unit:val("b")||"pcs",qty:n(val("c"))});ED=null;return}db.packing.push({name,unit:val("b")||"pcs",qty:n(val("c"))})},
 html:()=>form("Packing & Printing Master",[["a","Material (160mm Roll / Carton)"],["b","Unit (kg / pcs / rolls)"],["c","Opening Stock","number"]],"+ Save Packing Material",tbl(["Item","Stock","Unit",""],db.packing.map((p,i)=>[E(p.name),f(p.qty),E(p.unit),act("packing",i)])))},
party:{save(){const name=val("a");if(!name)return"Enter party name";if(ED){Object.assign(db.parties[ED.i],{name,city:val("b")});ED=null;return}db.parties.push({name,city:val("b")})},
 html:()=>form("Supplier / Party Master",[["a","Party / Supplier / Customer Name"],["b","City / Mandi"]],"+ Save Party",tbl(["Party","City",""],db.parties.map((p,i)=>[E(p.name),E(p.city),act("party",i)])))},
purchase:{save(){const material=val("e"),qty=n(val("f"));if(!material)return"Enter item name";if(qty<=0)return"Enter valid quantity";const category=val("d");
 db.purchases.push({date:val("a")||today,bill:val("b"),party:val("c")||"Cash / Mandi",category,material,qty,rate:n(val("g")),photo:PH});
 const arr=category==="Raw Material"?db.raw:db.packing,e=arr.find(r=>same(r.name,material));e?e.qty=n(e.qty)+qty:arr.push(category==="Raw Material"?{name:material,qty}:{name:material,unit:"kg/pcs",qty})},
 html:()=>form("Purchase Entry (Inward)",[["a","Date","date"],["b","Bill / Lot No."],["c","Supplier / Party","text","dlP"],["d","Category","select",["Raw Material","Packing Material"]],["e","Item Name","text","dlI"],["f","Quantity (kg / pcs)","number"],["g","Rate per Unit (₹)","number"],["h","📷 Bill / Maal ki Photo (optional)","file"]],"+ Save Purchase & Update Stock",'<div class="res" id="st" style="display:none"></div><h3>Ya list paste karo</h3><label>Har line: item, qty, rate (aakhri mein P likho to Packing). Date / Bill / Party upar ke boxes se aayenge</label><textarea id="bt" rows="5" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px"></textarea><button class="btn s" id="bk">Paste se sab add karo</button>')},
inward:{html:()=>`<div class="card"><h2>Inward Purchase History</h2>${tbl(["Date","Bill","Party","Category","Item","Qty","Rate","Total","Photo"],db.purchases.map((p,i)=>[E(p.date),E(p.bill),E(p.party),E(p.category),E(p.material),f(p.qty),"₹"+f(p.rate),"₹"+f(n(p.qty)*n(p.rate)),p.photo?`<img src="${p.photo}" data-ph="${i}" style="height:34px;border-radius:4px">`:"-"]).reverse())}</div>`},
daily:{save(){const raw=val("b"),i=n(val("c")),o=n(val("d"));if(!raw||i<=0||val("d")==="")return"Enter material, input and output qty";if(o>i)return"Output cannot exceed input";
 const e=db.raw.find(r=>same(r.name,raw));if(e)e.qty=Math.max(0,n(e.qty)-(i-o));db.dailyProd.push({date:val("a")||today,rawName:raw,inputQty:i,outputQty:o,lossPct:((i-o)/i*100).toFixed(2),note:val("e")})},
 html:()=>form("Daily Production (Cleaning / Grading / Roasting)",[["a","Date","date"],["b","Raw Material Issued","text","dlR"],["c","Input Qty (kg)","number"],["d","Clean Output Qty (kg)","number"],["e","Process / Operator Note"]],"+ Save Daily Production",tbl(["Date","Material","Input","Output","Loss %","Note"],db.dailyProd.slice().reverse().map(d=>[E(d.date),E(d.rawName),f(d.inputQty)+" kg",f(d.outputQty)+" kg",E(d.lossPct)+"%",E(d.note||"-")])))},
batch:{save(){const product=val("c"),raw=val("d"),used=n(val("e")),pc=Math.round(n(val("f")));if(!product||pc<=0)return"Enter product and pouches packed";
 const e=db.raw.find(r=>same(r.name,raw));if(raw&&used>0&&e&&used>n(e.qty))return"Only "+f(e.qty)+" kg "+e.name+" in stock";
 let rate=0;for(let i=db.purchases.length-1;i>=0;i--)if(same(db.purchases[i].material,raw)){rate=n(db.purchases[i].rate);break}
 const total=used*rate+n(val("g"))+n(val("h"));if(e&&used>0)e.qty=Math.max(0,n(e.qty)-used);
 db.batches.push({date:val("a")||today,batchNo:val("b")||"B-"+(db.batches.length+1),product,rawName:raw,rawUsed:used,pouches:pc,totalCost:total,costPerPouch:total/pc})},
 html:()=>form("Packing Batch (Pouch Filling)",[["a","Date","date"],["b","Batch No. (SA-01)"],["c","Retail Product (SKU)","text","dlS"],["d","Raw Material Used","text","dlR"],["e","Raw Consumed (kg)","number"],["f","Pouches Packed","number"],["g","Laminate / Packing Cost (₹)","number"],["h","Labor & Power Cost (₹)","number"]],"+ Save Packing Batch",tbl(["Date","Batch","Product","Raw","Pouches","Cost/Pouch"],db.batches.slice().reverse().map(b=>[E(b.date),E(b.batchNo),E(b.product),f(b.rawUsed)+" kg",b.pouches,"₹"+f(b.costPerPouch)])))},
costing:{save(){const r=n(val("a")),g=n(val("b")),w=n(val("c")),pc=n(val("d")),oh=n(val("e")),sp=n(val("f")),rm=g/1000*(1+w/100)*r,t=rm+pc+oh,pr=sp-t;
 $("out").style.display="block";$("out").innerHTML=`<b>Raw material cost:</b> ₹${f(rm)}<br><b>Total cost / pouch:</b> ₹${f(t)}<br><b>Profit / pouch:</b> ₹${f(pr)} (${sp>0?(pr/sp*100).toFixed(1):"0.0"}% margin)`;return 0},
 html:()=>form("Pouch Costing & Margin Calculator",[["a","Raw Material Rate / kg (₹)","number"],["b","Net Weight / Pouch (g)","number"],["c","Wastage / Moisture Loss (%)","number"],["d","Pouch / Laminate Cost (₹)","number"],["e","Labor + Power + Overhead (₹)","number"],["f","Selling Price (₹)","number"]],"Calculate Cost & Margin",`<div class="res" id="out" style="display:none"></div>`)},
sale:{save(){const product=val("c"),pc=Math.round(n(val("d")));if(!product||pc<=0)return"Enter product and pouches";const av=finished()[product]||0;if(pc>av)return"Only "+av+" pouches of "+product+" in stock";
 db.sales.push({date:val("a")||today,party:val("b")||"Cash",product,pouches:pc,rate:n(val("e"))})},
 html:()=>form("Sales / Dispatch Entry",[["a","Date","date"],["b","Customer / Party","text","dlP"],["c","Product (SKU)","text","dlS"],["d","Pouches Sold","number"],["e","Rate per Pouch (₹)","number"]],"+ Save Sale & Reduce Stock",tbl(["Date","Party","Product","Pouches","Rate","Total"],db.sales.slice().reverse().map(s=>[E(s.date),E(s.party),E(s.product),s.pouches,"₹"+f(s.rate),"₹"+f(s.pouches*s.rate)])))},
stock(){const fm=finished();return `<div class="card"><h2>Live Stock Summary</h2><h3>Raw Material</h3>${tbl(["Material","Available"],db.raw.map(r=>[E(r.name),(n(r.qty)<LOW?`<span class="low">${f(r.qty)} kg (low)</span>`:f(r.qty)+" kg")]))}<h3>Finished Pouches (packed − sold)</h3>${tbl(["Product","Pouches"],Object.keys(fm).map(k=>[E(k),fm[k]]))}<h3>Packing Material</h3>${tbl(["Item","Stock","Unit"],db.packing.map(p=>[E(p.name),f(p.qty),E(p.unit)]))}</div>`},
report(){const rev=db.sales.reduce((a,s)=>a+n(s.pouches)*n(s.rate),0);return `<div class="card"><h2>Batch Costing & Production Report</h2>${tbl(["Date","Batch","Product","Raw","Pouches","Total Cost","Cost/Pouch"],db.batches.slice().reverse().map(b=>[E(b.date),E(b.batchNo),E(b.product),f(b.rawUsed)+" kg",b.pouches,"₹"+f(b.totalCost),"₹"+f(b.costPerPouch)]))}<h3>Total sales: ₹${f(rev)}</h3></div>`},
export:{save(){const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';let c="Section,Date,Name/Party,Detail1,Detail2,Detail3\n";
 db.products.forEach(p=>c+=["Product","",p.name,p.weight+"g","MRP "+p.mrp,""].map(q)+"\n");db.raw.forEach(r=>c+=["Raw Stock","",r.name,r.qty+" kg","",""].map(q)+"\n");
 db.purchases.forEach(p=>c+=["Purchase",p.date,p.party,p.material,p.qty,"Rate "+p.rate].map(q)+"\n");db.batches.forEach(b=>c+=["Batch",b.date,b.product,b.batchNo,b.pouches+" pcs","Cost "+f(b.costPerPouch)].map(q)+"\n");
 db.sales.forEach(s=>c+=["Sale",s.date,s.party,s.product,s.pouches+" pcs","Rate "+s.rate].map(q)+"\n");dl(c,"sadhna_agro_erp_report.csv","text/csv");return 0},
 html:()=>`<div class="card"><h2>Excel / CSV Export</h2><p style="font-size:13px;color:var(--mu);margin-bottom:12px">Masters, purchases, batches aur sales CSV mein (Excel mein khulta hai).</p><button class="btn" id="go">Download Complete ERP Data (CSV)</button></div>`},
backup:{save(){dl(JSON.stringify(db,null,2),"sadhna_agro_backup.json","application/json");return 0},
 html:()=>`<div class="card"><h2>Backup & Restore</h2><button class="btn" id="go">Download JSON Backup</button><div class="fg" style="margin-top:16px"><label>Restore from .json file</label><input type="file" id="rf" accept=".json"></div><button class="btn s" id="rs">Restore Backup Data</button></div>`}
};
function dl(c,name,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type}));a.download=name;a.click()}
const G={dashboard:["Dashboard",["dashboard"]],masters:["Masters",["product","raw","packing","party"]],purchase:["Purchase",["purchase","inward"]],production:["Production",["daily","batch","costing"]],sales:["Sales",["sale"]],stock:["Stock",["stock"]],reports:["Reports & Backup",["report","export","backup"]]};
const LB={dashboard:"Dashboard",product:"Product Master",raw:"Raw Material",packing:"Packing Master",party:"Party Master",purchase:"Purchase Entry",inward:"Inward History",daily:"Daily Production",batch:"Packing Batches",costing:"Costing Calc",sale:"Sales / Dispatch",stock:"Live Stock",report:"Batch Report",export:"CSV Export",backup:"Backup / Restore"};
let grp="dashboard",pg="dashboard",PH="",EX=[],BILL={},ED=null;
const FM={product:["name","weight","mrp"],raw:["name","qty"],packing:["name","unit","qty"],party:["name","city"]};
const arr=k=>db[{product:"products",raw:"raw",packing:"packing",party:"parties"}[k]];
const act=(k,i)=>`<button class="ab" data-ed="${k}:${i}">Edit</button><button class="ab" data-dl="${k}:${i}">Delete</button>`;
function st(m){const e=$("st");if(e){e.style.display="block";e.textContent=m}}
function fill(id,v){const el=$(id);if(el&&v!==undefined&&v!==null&&v!=="")el.value=v}
function fillItem(it){fill("a",BILL.date);fill("b",BILL.bill);fill("c",BILL.party);fill("d",/pack/i.test(it.category)?"Packing Material":"Raw Material");fill("e",it.name);fill("f",it.qty||"");fill("g",it.rate||"")}
async function readBill(blob){
 try{
  const s=window.claude&&await claude.use("sample");if(!s){st("Auto-read is page par available nahi (permission/Claude app check karo). Item khud bharo.");return toast("Auto-read available nahi")}
  const names=db.raw.concat(db.packing).map(x=>x.name).join(", ")||"koi nahi";
  const r=await s.json("Ye ek purchase bill / parchi ki photo hai (Hindi, English ya Hinglish, handwritten bhi ho sakta hai). Sirf JSON do, koi aur text nahi: {\"date\":\"YYYY-MM-DD ya empty\",\"bill\":\"bill/invoice no\",\"party\":\"supplier ka naam\",\"items\":[{\"name\":\"\",\"category\":\"Raw Material ya Packing Material\",\"qty\":number,\"rate\":number}]}. Rules: qty kg ya pcs mein do (quintal=100 kg, gram/1000 kg mein badlo); rate usi unit ke hisaab se Rs per kg ya per pcs (quintal rate ho to 100 se bhaag do). Masala, dry fruit, anaj = Raw Material; laminate, roll, carton, printing = Packing Material. Agar item mere existing naamo mein se kisi ka hi hai to wahi naam likho: "+names+". Jo cheez padh na sako use empty ya 0 chhodo, andaaza mat lagao.",{images:[blob],cache:false});
  BILL={photo:PH,date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")?r.date:"",bill:r.bill,party:r.party};
  EX=Array.isArray(r.items)?r.items.slice():[];
  if(!EX.length){st("Bill samajh nahi aaya: "+JSON.stringify(r).slice(0,200));return toast("Bill samajh nahi aaya")}
  const t=EX.length;fillItem(EX.shift());st("Bill padh liya: "+t+" item mile. Check karke Save karo");toast("Bill padh liya ✓ "+t+" item. Check karke Save karo"+(t>1?" (baaki agle aayenge)":""));
 }catch(e){st("Auto-read fail: "+((e&&e.code)||"")+" "+((e&&e.message)||e)+" — item khud bharo");toast("Bill padh nahi paya")}
}
function show(){PH="";
 $("nav").innerHTML=Object.keys(G).map(g=>`<button data-g="${g}" class="${g===grp?"on":""}">${G[g][0]}</button>`).join("");
 const ps=G[grp][1];$("sub").hidden=ps.length<2;$("sub").innerHTML=ps.map(p=>`<button data-p="${p}" cl
