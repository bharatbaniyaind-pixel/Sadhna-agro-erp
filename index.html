function evaluateProduction(p){
  p = p || {};
  const estPouches = Math.max(0, n(p.estimated_pouches));
  const actualPouches = Math.max(0, n(p.actual_pouches));
  const pouchWtG = Math.max(0, n(p.pouch_wt_g));
  const outputKg = r3((actualPouches * pouchWtG) / 1000);
  const packets = r2(actualPouches / 36);
  const boris = r3(actualPouches / 720);
  const outerCount = Math.ceil(actualPouches / 36);
  const boriCount = Math.ceil(actualPouches / 720);

  const rawLines = Array.isArray(p.raw_lines) ? p.raw_lines : [];
  let totalRawQty = 0, totalRawCost = 0;
  const evaluatedRaw = rawLines.map(line => {
    const consumed = Math.max(0, r3(n(line.open) - n(line.close)));
    const cost = r2(consumed * n(line.rate));
    totalRawQty = r3(totalRawQty + consumed);
    totalRawCost = r2(totalRawCost + cost);
    return {...line, consumed, cost};
  });

  const printLines = Array.isArray(p.print_lines) ? p.print_lines : [];
  let totalPrintUsed = 0, totalPrintWastage = 0, totalPrintGoodUsed = 0;
  let totalPrintGoodCost = 0, totalPrintWastageCost = 0;
  const evaluatedPrint = printLines.map(line => {
    const physicalUsed = Math.max(0, r3(n(line.open) - n(line.close)));
    const wastageQty = Math.min(physicalUsed, Math.max(0, r3(n(line.wastage))));
    const netGoodUsed = Math.max(0, r3(physicalUsed - wastageQty));
    const goodCost = r2(netGoodUsed * n(line.rate));
    const wasteCost = r2(wastageQty * n(line.rate));
    totalPrintUsed = r3(totalPrintUsed + physicalUsed);
    totalPrintWastage = r3(totalPrintWastage + wastageQty);
    totalPrintGoodUsed = r3(totalPrintGoodUsed + netGoodUsed);
    totalPrintGoodCost = r2(totalPrintGoodCost + goodCost);
    totalPrintWastageCost = r2(totalPrintWastageCost + wasteCost);
    return {...line, physicalUsed, wastageQty, netGoodUsed, goodCost, wasteCost};
  });

  const otherPrintCost = r2(n(p.other_printing_cost));
  const labourHrs = n(p.labour_hrs), labourRate = n(p.labour_rate), labourCost = r2(labourHrs * labourRate);
  const machHrs = n(p.mach_hrs), machRate = p.machine_rate !== undefined ? n(p.machine_rate) : cfg.machineRate, machineCost = r2(machHrs * machRate);
  const packingCost = r2(n(p.packing_cost));
  const outerRate = n(p.outer_rate), boriRate = n(p.bori_rate);
  const outerCost = r2(outerCount * outerRate), boriCost = r2(boriCount * boriRate);
  const denglerCost = r2(n(p.dengler_cost)), marketingCost = r2(n(p.marketing_cost));

  const directOperationalCost = r2(totalRawCost + totalPrintGoodCost + totalPrintWastageCost + otherPrintCost + labourCost + machineCost + packingCost + outerCost + boriCost + denglerCost + marketingCost);
  const intRate = p.interest_rate !== undefined ? n(p.interest_rate) : cfg.interestRate;
  const intDays = p.interest_days !== undefined ? n(p.interest_days) : cfg.interestDays;
  const interestCost = r2((directOperationalCost * intRate * intDays) / 36500);
  const netProductionCost = r2(directOperationalCost + interestCost);
  const gstRate = p.gst_rate !== undefined ? n(p.gst_rate) : cfg.gstRate;
  const itcEligible = p.itc_eligible !== false;
  const gstAmount = r2((netProductionCost * gstRate) / 100);
  const grossCostWithGst = r2(netProductionCost + gstAmount);
  const effectiveFinalCost = itcEligible ? netProductionCost : grossCostWithGst;

  return {
    estPouches, actualPouches, pouchWtG, outputKg, packets, boris, outerCount, boriCount,
    evaluatedRaw, totalRawQty, totalRawCost, evaluatedPrint, totalPrintUsed, totalPrintWastage,
    totalPrintGoodUsed, totalPrintGoodCost, totalPrintWastageCost, otherPrintCost,
    labourHrs, labourRate, labourCost, machHrs, machRate, machineCost, packingCost,
    outerRate, outerCost, boriRate, boriCost, denglerCost, marketingCost,
    directOperationalCost, intRate, intDays, interestCost, netProductionCost,
    gstRate, itcEligible, gstAmount, grossCostWithGst, effectiveFinalCost,
    costPerPouch: actualPouches ? r2(effectiveFinalCost / actualPouches) : 0,
    costPerPacket: packets ? r2(effectiveFinalCost / packets) : 0,
    costPerKg: outputKg ? r2(effectiveFinalCost / outputKg) : 0
  };
}

function buildStockLedger(excludeTxId = null){
  const map = new Map();
  store.masters.filter(m => m.status === 'active').forEach(m => {
    map.set(m.id, {
      ...m, opening:0, purchased:0, purchaseReturn:0, consumed:0,
      produced:0, dispatched:0, sold:0, saleReturn:0, factoryStock:0, godownStock:0, movements:[]
    });
  });

  const activeTxs = store.transactions
    .filter(t => t.status === 'active' && t.id !== excludeTxId)
    .sort((a,b) => String(a.tx_date || '').localeCompare(String(b.tx_date || '')));

  activeTxs.forEach(tx => {
    const p = tx.payload || {};
    const recMove = (item, loc, change, label) => {
      item.movements.push({ tx_id:tx.id, tx_number:tx.tx_number, date:tx.tx_date, type:tx.tx_type, location:loc, change, label });
    };
    if(tx.tx_type === 'opening_stock'){
      const it = map.get(p.item_id);
      if(it){
        const q = r3(n(p.qty));
        if(p.location === 'godown') it.godownStock = r3(it.godownStock + q);
        else { it.opening = r3(it.opening + q); it.factoryStock = r3(it.factoryStock + q); }
        recMove(it, p.location || 'factory', q, 'Opening Stock');
      }
    } else if(tx.tx_type === 'purchase'){
      const it = map.get(p.item_id);
      if(it){ const q = r3(n(p.qty)); it.purchased = r3(it.purchased + q); it.factoryStock = r3(it.factoryStock + q); recMove(it, 'factory', +q, `Purchase (${p.party_name||''})`); }
    } else if(tx.tx_type === 'purchase_return'){
      const it = map.get(p.item_id);
      if(it){ const q = r3(n(p.qty)); it.purchaseReturn = r3(it.purchaseReturn + q); it.factoryStock = r3(it.factoryStock - q); recMove(it, 'factory', -q, `Purchase Return (${p.party_name||''})`); }
    } else if(tx.tx_type === 'production'){
      const c = evaluateProduction(p);
      c.evaluatedRaw.forEach(rl => {
        const it = map.get(rl.item_id);
        if(it && rl.consumed > 0){ it.consumed = r3(it.consumed + rl.consumed); it.factoryStock = r3(it.factoryStock - rl.consumed); recMove(it, 'factory', -rl.consumed, `Production Batch ${tx.tx_number}`); }
      });
      c.evaluatedPrint.forEach(pl => {
        const it = map.get(pl.item_id);
        if(it && pl.physicalUsed > 0){ it.consumed = r3(it.consumed + pl.physicalUsed); it.factoryStock = r3(it.factoryStock - pl.physicalUsed); recMove(it, 'factory', -pl.physicalUsed, `Printing Batch ${tx.tx_number}`); }
      });
      const prod = map.get(p.product_id);
      if(prod){
        const addQty = (prod.unit === 'pouch' || prod.unit === 'piece') ? c.actualPouches : c.outputKg;
        prod.produced = r3(prod.produced + addQty); prod.factoryStock = r3(prod.factoryStock + addQty); recMove(prod, 'factory', +addQty, `Production Output ${tx.tx_number}`);
      }
    } else if(tx.tx_type === 'dispatch'){
      const prod = map.get(p.product_id);
      if(prod){ const q = r3(n(p.qty)); prod.dispatched = r3(prod.dispatched + q); prod.factoryStock = r3(prod.factoryStock - q); prod.godownStock = r3(prod.godownStock + q); recMove(prod, 'factory->godown', q, `Dispatch to ${p.godown_name||'Godown'}`); }
    } else if(tx.tx_type === 'sale'){
      const prod = map.get(p.product_id);
      if(prod){ const q = r3(n(p.qty)); prod.sold = r3(prod.sold + q); prod.godownStock = r3(prod.godownStock - q); recMove(prod, 'godown', -q, `Sale (${p.party_name||''})`); }
    } else if(tx.tx_type === 'sale_return'){
      const prod = map.get(p.product_id);
      if(prod){ const q = r3(n(p.qty)); prod.saleReturn = r3(prod.saleReturn + q); prod.godownStock = r3(prod.godownStock + q); recMove(prod, 'godown', +q, `Sales Return (${p.party_name||''})`); }
    }
  });
  return Array.from(map.values());
}

        let res = {error: null};
        if(q.op === 'master') res = await sb.from('sadhna_masters').upsert({...q.data, user_id: authUser.id}, {onConflict:'id'});
        else if(q.op === 'party') res = await sb.from('sadhna_parties').upsert({...q.data, user_id: authUser.id}, {onConflict:'id'});
        else if(q.op === 'tx') res = await sb.from('sadhna_transactions').upsert({...q.data, user_id: authUser.id}, {onConflict:'id'});
        else if(q.op === 'audit') res = await sb.from('sadhna_audit_logs').upsert({...q.data, user_id: authUser.id}, {onConflict:'id'});
        if(res.error){ q.retries = (q.retries||0)+1; q.lastError = res.error.message||'Supabase Error'; errMsg = q.lastError; remainingQueue.push(q); }
      }
      syncQueue = remainingQueue;

      if(syncQueue.length === 0){
        const [mRes, pRes, tRes] = await Promise.all([
          sb.from('sadhna_masters').select('*').eq('user_id', authUser.id),
          sb.from('sadhna_parties').select('*').eq('user_id', authUser.id),
          sb.from('sadhna_transactions').select('*').eq('user_id', authUser.id)
        ]);
        if(mRes.error) throw mRes.error;
        if(pRes.error) throw pRes.error;
        if(tRes.error) throw tRes.error;
        mergeByTimestamp('masters', mRes.data || []);
        mergeByTimestamp('parties', pRes.data || []);
        mergeByTimestamp('transactions', tRes.data || []);
        sbOk = true;
      }
    }

    if(includeGoogleSheets){
      const gsUrlVal = String(cfg.gsUrl || '').trim();
      if(!gsUrlVal || !gsUrlVal.startsWith('https://script.google.com/')){
        throw new Error('Google Apps Script Web App URL सेट नहीं है');
      }
      const payloadRecords = [
        ...store.masters.map(m => ({category: m.master_type, monthly: false, record: m})),
        ...store.parties.map(p => ({category: p.party_type, monthly: false, record: p})),
        ...store.transactions.map(t => ({
          category: t.tx_type, monthly: true,
          record: {...t, summary: `${t.tx_type.toUpperCase()} #${t.tx_number}`, ...(t.payload||{})}
        }))
      ];
      let totalSynced = 0;
      for(let i = 0; i < payloadRecords.length; i += 75){
        const resp = await fetch(gsUrlVal, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({token: cfg.gsToken, records: payloadRecords.slice(i, i + 75)})
        });
        const rawText = await resp.text();
        if(!resp.ok) throw new Error(`HTTP ${resp.status}: ${rawText.slice(0, 120)}`);
        let data = null;
        try { data = JSON.parse(rawText); }
        catch(_) { throw new Error(`Invalid JSON: ${rawText.slice(0, 120)}`); }
        if(!data || !data.ok) throw new Error((data && data.error) || 'Google Sheets Script Error');
        totalSynced += n(data.synced);
      }
      gsOk = true;
      addAudit('GS_SYNC', 'GoogleSheets', 'BATCH', `Google Sheets में ${totalSynced} रिकॉर्ड Sync हुए`);
    }

    const nowTime = new Date().toLocaleTimeString('hi-IN', {hour:'2-digit', minute:'2-digit'});
    if(sbOk || gsOk) cfg.lastSyncStatus = `Synced (${nowTime})`;
    else if(!authUser) cfg.lastSyncStatus = 'Local Mode (Login Required for Cloud)';
    else if(errMsg) cfg.lastSyncStatus = 'Sync Failed: ' + String(errMsg).slice(0, 28);
    else if(syncQueue.length > 0) cfg.lastSyncStatus = 'Pending Queue';
  } catch(e){
    cfg.lastSyncStatus = 'Sync Failed';
    console.error('Sync failure:', e);
    if(includeGoogleSheets) alert('❌ Sync विफल: ' + (e && e.message ? e.message : String(e)));
  } finally{
    syncing = false;
    persist();
    if(page === 'cloud') safeRender();
  }
}

function mergeByTimestamp(key, remoteList){
  const map = new Map((store[key] || []).map(x => [x.id, x]));
  (remoteList || []).forEach(rem => {
    if(!rem || !rem.id) return;
    const loc = map.get(rem.id);
    const remTs = new Date(rem.updated_at || rem.created_at || 0).getTime() || 0;
    const locTs = loc ? (new Date(loc.updated_at || loc.created_at || 0).getTime() || 0) : -1;
    if(!loc || remTs >= locTs) map.set(rem.id, rem);
  });
  store[key] = Array.from(map.values());
}

function saveTransaction(tx, isEdit = false){
  if(!isEdit && store.transactions.some(t => t.id === tx.id)){ alert('Duplicate Transaction ID!'); return false; }
  if(isEdit){
    const idx = store.transactions.findIndex(t => t.id === tx.id);
    if(idx !== -1) store.transactions[idx] = tx;
    addAudit('EDIT', tx.tx_type, tx.tx_number, 'रिकॉर्ड संशोधित किया गया');
  } else {
    store.transactions.unshift(tx);
    addAudit('CREATE', tx.tx_type, tx.tx_number, `नया ${tx.tx_type} रिकॉर्ड (${tx.tx_date}) दर्ज`);
  }
  queueUpsert('tx', tx.id, tx);
  runCloudSync(false);
  return true;
}

function toggleCancelTx(id){
  if(!hasPerm('editDel')){ alert('केवल Admin या Accountant ही Cancel/Restore कर सकते हैं।'); return; }
  const tx = store.transactions.find(t => t.id === id);
  if(!tx) return;
  const nextStatus = tx.status === 'active' ? 'cancelled' : 'active';
  const reason = prompt(nextStatus === 'cancelled' ? 'Cancel करने का कारण:' : 'Restore करने का कारण:');
  if(!reason) return;
  tx.status = nextStatus;
  tx.updated_at = new Date().toISOString();
  addAudit(nextStatus === 'cancelled' ? 'CANCEL' : 'RESTORE', tx.tx_type, tx.tx_number, reason);
  queueUpsert('tx', tx.id, tx);
  runCloudSync(false);
  safeRender();
}

function go(p){

}

          if(!canBypassNegativeStock() && (!st || qty > st.godownStock)){ alert(`❌ Godown Stock अपर्याप्त (${st?st.godownStock:0})`); return; }
        }
        const base = r2(qty * rate), gstAmt = r2(base * gst / 100);
        saveTransaction({ id: uid(), tx_type: type, tx_number: String(f.get('tx_number')||'').trim(), tx_date: f.get('tx_date'), status: 'active', created_by: authUser?.email||'Local', created_at: new Date().toISOString(), updated_at: new Date().toISOString(), payload: { product_id: prodId, party_name: String(f.get('party_name')||'').trim(), qty, rate, gst_rate: gst, base_amount: base, gst_amount: gstAmt, grand_total: r2(base+gstAmt) } });
        safeRender();
      };
    }
    return;
  }

  if(page === 'expenses'){
    const expTxs = store.transactions.filter(t => t.tx_type === 'expense');
    $('app').innerHTML = `
      <h2>15. Expenses & Accounts</h2>
      ${hasPerm('expense') ? `<div class="card"><form id="expForm" class="form">
        <div><label>दिनांक *</label><input name="tx_date" type="date" value="${today()}" required></div>
        <div><label>खर्च मद *</label><select name="head"><option>Labour & Wages</option><option>Electricity & Power</option><option>Machine Maintenance</option><option>Printing & Packaging</option><option>Transport & Freight</option><option>Marketing & Dengler</option><option>Interest & Finance</option><option>Office & General</option></select></div>
        <div><label>विवरण *</label><input name="description" required></div>
        <div><label>राशि ₹ *</label><input name="amount" type="number" step=".01" min=".01" required></div>
        <div><label>GST ₹</label><input name="gst_amount" type="number" step=".01" value="0"></div>
        <div><label>माध्यम</label><select name="mode"><option>Cash</option><option>Bank / UPI</option><option>Credit</option></select></div>
        <button>खर्च सेव करें</button>
      </form></div>` : ''}
      <div class="card tablewrap"><table>
        <tr><th>दिनांक</th><th>मद</th><th>विवरण</th><th>माध्यम</th><th>राशि ₹</th><th>GST ₹</th><th>कुल ₹</th><th>एक्शन</th></tr>
        ${expTxs.map(t => `<tr class="${t.status==='cancelled'?'cancelled':''}">
          <td>${esc(t.tx_date)}</td><td><b>${esc(t.payload?.head)}</b></td><td>${esc(t.payload?.description)}</td><td>${esc(t.payload?.mode)}</td>
          <td>${money(t.payload?.amount)}</td><td>${money(t.payload?.gst_amount)}</td><td><b>${money(n(t.payload?.amount)+n(t.payload?.gst_amount))}</b></td>
          <td>${hasPerm('editDel') ? `<button class="danger" onclick="toggleCancelTx('${t.id}')">${t.status==='active'?'Cancel':'Restore'}</button>` : '-'}</td>
        </tr>`).join('') || '<tr><td colspan="8">कोई खर्च नहीं</td></tr>'}
      </table></div>`;
    if($('expForm')){
      $('expForm').onsubmit = e => {
        e.preventDefault();
        const f = new FormData(e.target);
        saveTransaction({ id: uid(), tx_type: 'expense', tx_number: 'EXP-' + Date.now().toString().slice(-5), tx_date: f.get('tx_date'), status: 'active', created_by: authUser?.email||'Local', created_at: new Date().toISOString(), updated_at: new Date().toISOString(), payload: { head: f.get('head'), description: String(f.get('description')||'').trim(), amount: n(f.get('amount')), gst_amount: n(f.get('gst_amount')), mode: f.get('mode') } });
        safeRender();
      };
    }
    return;
  }

  if(page === 'reports'){
    const products = store.masters.filter(m => m.master_type === 'product');
    $('app').innerHTML = `
      <h2>16. Monthly Reports & 11-Sheet Excel / PDF Export</h2>
      <div class="card no-print">
        <div class="form">
          <div><label>महीना</label><input type="month" id="repM" value="${curMonth()}"></div>
          <div><label>उत्पाद</label><select id="repP"><option value="all">सभी उत्पाद</option>${products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div>
          <button id="runRepBtn">रिपोर्ट दिखाएँ</button>
        </div>
        <div class="actions" style="margin-top:10px">
          <button id="xl11Btn">📊 11-Sheet Excel (.xlsx)</button>
          <button id="pdfRepBtn" class="secondary">📄 PDF डाउनलोड</button>
        </div>
      </div>
      <div id="repOut"></div>`;

    const buildMonthly = () => {
      const m = $('repM').value, pid = $('repP').value;
      const inM = t => t.status === 'active' && (!m || String(t.tx_date||'').startsWith(m));
      const rProd = activeTxs.filter(t => inM(t) && t.tx_type==='production' && (pid==='all' || t.payload?.product_id===pid));
      const rPur  = activeTxs.filter(t => inM(t) && ['purchase','purchase_return'].includes(t.tx_type) && (pid==='all' || t.payload?.item_id===pid));
      const rDisp = activeTxs.filter(t => inM(t) && t.tx_type==='dispatch' && (pid==='all' || t.payload?.product_id===pid));
      const rSale = activeTxs.filter(t => inM(t) && ['sale','sale_return'].includes(t.tx_type) && (pid==='all' || t.payload?.product_id===pid));
      const rExp  = activeTxs.filter(t => inM(t) && t.tx_type==='expense');

      const prodCostTotal = r2(rProd.reduce((s,t) => s + evaluateProduction(t.payload).effectiveFinalCost, 0));
      const pouchesTotal  = rProd.reduce((s,t) => s + evaluateProduction(t.payload).actualPouches, 0);
      const salesExGst    = r2(rSale.reduce((s,t) => s + (t.tx_type==='sale'?1:-1)*n(t.payload?.base_amount), 0));
      const purExGst      = r2(rPur.reduce((s,t) => s + (t.tx_type==='purchase'?1:-1)*n(t.payload?.base_amount), 0));
      const directExp     = r2(rExp.reduce((s,t) => s + n(t.payload?.amount), 0));
      const netPL         = r2(salesExGst - prodCostTotal - directExp);

      $('repOut').innerHTML = `<div id="pdfTarget"><div class="card">
        <h3>Monthly Report (${esc(m||'All')})</h3>
        <div class="grid">
          <div class="card"><div class="muted">उत्पादित पाउच</div><div class="metric">${pouchesTotal}</div></div>
          <div class="card"><div class="muted">उत्पादन लागत</div><div class="metric">${money(prodCostTotal)}</div></div>
          <div class="card"><div class="muted">खरीद (Ex-GST)</div><div class="metric">${money(purExGst)}</div></div>
          <div class="card"><div class="muted">बिक्री (Ex-GST)</div><div class="metric">${money(salesExGst)}</div></div>
          <div class="card"><div class="muted">अन्य खर्चे</div><div class="metric">${money(directExp)}</div></div>
          <div class="card"><div class="muted">Net P/L</div><div class="metric">${money(netPL)}</div></div>
        </div>
      </div></div>`;
      window.__repPayload = { m, pid, rProd, rPur, rDisp, rSale, rExp, ledger, summary:{pouchesTotal, prodCostTotal, purExGst, salesExGst, directExp, netPL} };
    };
    $('runRepBtn').onclick = buildMonthly;
    buildMonthly();

    $('xl11Btn').onclick = () => {
      if(!window.XLSX){ alert('Excel लाइब्रेरी लोड नहीं हुई।'); return; }
      const d = window.__repPayload;
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Metric','Value'],['Pouches',d.summary.pouchesTotal],['Prod Cost',d.summary.prodCostTotal],['Purchase',d.summary.purExGst],['Sales',d.summary.salesExGst],['Expenses',d.summary.directExp],['Net PL',d.summary.netPL]]), 'Summary');
      XLSX.writeFile(wb, `Sadhna-Agro-Report-${d.m||'all'}.xlsx`);
    };
    $('pdfRepBtn').onclick = async () => {
      if(!window.html2pdf){ alert('PDF लाइब्रेरी लोड नहीं हुई।'); return; }
      await html2pdf().from($('pdfTarget')).save(`Sadhna-Agro-Report-${$('repM').value||'all'}.pdf`);
    };
    return;
  }

  if(page === 'users'){
    $('app').innerHTML = `
      <h2>17. User Management</h2>
      <div class="card"><div class="form">
        <div><label>Role</label><select id="activeRoleSel"><option value="admin" ${cfg.activeRole==='admin'?'selected':''}>Admin</option><option value="production" ${cfg.activeRole==='production'?'selected':''}>Production</option><option value="store" ${cfg.activeRole==='store'?'selected':''}>Store</option><option value="accountant" ${cfg.activeRole==='accountant'?'selected':''}>Accountant</option></select></div>
        <div><label>Negative Stock</label><select id="negStockSel" ${cfg.activeRole!=='admin'?'disabled':''}><option value="false" ${!cfg.allowNegativeStockAdmin?'selected':''}>Blocked</option><option value="true" ${cfg.allowNegativeStockAdmin?'selected':''}>Allowed</option></select></div>
        <button id="applyRoleBtn">लागू करें</button>
      </div></div>`;
    $('applyRoleBtn').onclick = () => {
      cfg.activeRole = $('activeRoleSel').value;
      cfg.allowNegativeStockAdmin = cfg.activeRole === 'admin' && $('negStockSel').value === 'true';
      persist(); safeRender();
    };
    return;
  }

  if(page === 'cloud'){
    $('app').innerHTML = `
      <h2>18. Cloud Sync (Supabase + Google Sheets) & Backup</h2>
      <div class="card">
        <h3>Supabase Authentication & Real Queue Sync</h3>
        <div class="form">
          <div><label>Supabase Login Email</label><input id="loginEmail" type="email" value="${esc(authUser?.email||'')}" placeholder="आपका ईमेल"></div>
          <button id="sendOtpBtn">Login Link भेजें</button>
          <button id="syncSbBtn" class="secondary">☁ Sync Now (${syncQueue.length} Pending)</button>
          <button id="signOutBtn" class="secondary">Sign Out</button>
        </div>
        <p class="muted" style="margin-top:8px">स्थिति: <b>${esc(cfg.lastSyncStatus)}</b> | Pending Queue: <b>${syncQueue.length}</b></p>
      </div>
      <div class="card">
        <h3>Google Sheets Monthly Auto-Tab Sync</h3>
        <div class="form">
          <div><label>Apps Script Web App URL</label><input id="gsUrlInp" type="url" value="${esc(cfg.gsUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div>
          <div><label>Security Token</label><input id="gsTokInp" value="${esc(cfg.gsToken)}"></div>
          <button id="saveGsCfgBtn">Save Settings</button>
          <button id="pushGsBtn" class="secondary">📊 Sync & Verify Google Sheets</button>
        </div>
      </div>
      <div class="card">
        <h3>Daily & Full JSON Backup / Safe Restore</h3>
        <div class="actions">
          <button onclick="downloadBackup('daily')">📅 Daily Backup</button>
          <button onclick="downloadBackup('full')" class="secondary">💾 Complete Backup</button>
          <button id="restBtn" class="secondary">♻ Restore Backup</button>
          <input type="file" id="restFile" accept="application/json" style="display:none">
        </div>
      </div>`;

    $('sendOtpBtn').onclick = async () => {
      try{
        await connectSupabase();
        const email = $('loginEmail').value.trim();
        if(!email){ alert('ईमेल दर्ज करें।'); return; }
        const redirect = location.href.startsWith('http') ? location.origin + location.pathname : undefined;
        const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: redirect}});
        if(error) throw error;
        alert('✅ Login Link ईमेल पर भेज दिया गया है।');
      }catch(e){ alert('❌ Login Error: ' + e.message); }
    };
    $('syncSbBtn').onclick = async () => { await connectSupabase(); await runCloudSync(false); safeRender(); };
    $('signOutBtn').onclick = async () => { if(sb) await sb.auth.signOut(); authUser = null; cfg.lastSyncStatus = 'Signed Out'; persist(); safeRender(); };
    $('saveGsCfgBtn').onclick = () => { cfg.gsUrl = $('gsUrlInp').value.trim(); cfg.gsToken = $('gsTokInp').value.trim(); persist(); alert('Google Sheets सेटिंग सेव हो गई।'); };
    $('pushGsBtn').onclick = () => runCloudSync(true);
    $('restBtn').onclick = () => $('restFile').click();
    $('restFile').onchange = async e => {
      const file = e.target.files[0];
      if(!file) return;
      try{
        const parsed = JSON.parse(await file.text());
        const src = parsed.store || parsed;
        if(Array.isArray(src.masters)) mergeByTimestamp('masters', src.masters);
        if(Array.isArray(src.parties)) mergeByTimestamp('parties', src.parties);
        if(Array.isArray(src.transactions)) mergeByTimestamp('transactions', src.transactions);
        persist(); alert('✅ डेटा Restore हो गया।'); go('dashboard');
      }catch(err){ alert('❌ अमान्य फाइल: ' + err.message); }
    };
    return;
  }

  if(page === 'audit'){
    $('app').innerHTML = `
      <h2>19. Settings & Audit Log</h2>
      <div class="card tablewrap"><table>
        <tr><th>समय</th><th>Actor</th><th>Role</th><th>Action</th><th>Module</th><th>Ref ID</th><th>विवरण</th></tr>
        ${store.auditLogs.map(a => `<tr><td>${new Date(a.created_at).toLocaleString('hi-IN')}</td><td>${esc(a.actor_email)}</td><td>${esc(a.actor_role)}</td><td><b>${esc(a.action)}</b></td><td>${esc(a.module)}</td><td>${esc(a.tx_id)}</td><td>${esc(a.summary)}</td></tr>`).join('') || '<tr><td colspan="7">कोई लॉग नहीं</td></tr>'}
      </table></div>`;
    return;
  }
}

window.fillMasterForm = id => {
  const it = store.masters.find(m => m.id === id);
  const f = $('mForm');
  if(!it || !f) return;
  f.elements.id.value = it.id; f.elements.code.value = it.code||''; f.elements.name.value = it.name||'';
  f.elements.category.value = it.category||''; f.elements.unit.value = it.unit||'kg';
  if(f.elements.pouch_wt_g) f.elements.pouch_wt_g.value = it.pouch_wt_g||0;
  f.elements.gst_rate.value = it.gst_rate ?? 18; f.elements.default_rate.value = it.default_rate||0; f.elements.min_stock.value = it.min_stock||0;
  window.scrollTo({top:0, behavior:'smooth'});
};

window.editSimpleTx = id => {
  const tx = store.transactions.find(t => t.id === id);
  const f = $('purForm');
  if(!tx || !f) return;
  f.elements.edit_id.value = tx.id; f.elements.tx_type.value = tx.tx_type; f.elements.tx_date.value = tx.tx_date;
  f.elements.tx_number.value = tx.tx_number; f.elements.party_name.value = tx.payload?.party_name||'';
  f.elements.item_id.value = tx.payload?.item_id||''; f.elements.qty.value = tx.payload?.qty||0;
  f.elements.rate.value = tx.payload?.rate||0; f.elements.gst_rate.value = tx.payload?.gst_rate ?? 18;
  window.scrollTo({top:0, behavior:'smooth'});
};

window.editProductionTx = id => {
  const tx = store.transactions.find(t => t.id === id);
  const f = $('prodForm');
  if(!tx || !f) return;
  const p = tx.payload || {};
  f.elements.edit_id.value = tx.id; f.elements.tx_date.value = tx.tx_date; f.elements.tx_number.value = tx.tx_number;
  f.elements.product_id.value = p.product_id||''; f.elements.estimated_pouches.value = p.estimated_pouches||0;
  f.elements.actual_pouches.value = p.actual_pouches||0; f.elements.pouch_wt_g.value = p.pouch_wt_g||0;
  $('rawLinesWrap').innerHTML = ''; (p.raw_lines && p.raw_lines.length ? p.raw_lines : [{}]).forEach(r => window.addRawRow(r));
  $('printLinesWrap').innerHTML = ''; (p.print_lines && p.print_lines.length ? p.print_lines : [{}]).forEach(pr => window.addPrintRow(pr));
  window.recalcProdForm();
  window.scrollTo({top:0, behavior:'smooth'});
};

window.viewItemMoves = id => {
  const item = buildStockLedger().find(l => l.id === id);
  const box = $('moveHistoryBox');
  if(!item || !box) return;
  box.innerHTML = `<div class="card"><h3>Movements: ${esc(item.name)}</h3><div class="tablewrap"><table>
    <tr><th>दिनांक</th><th>Voucher</th><th>Type</th><th>Location</th><th>Qty</th><th>विवरण</th></tr>
    ${item.movements.map(m => `<tr><td>${esc(m.date)}</td><td>${esc(m.tx_number)}</td><td>${esc(m.type)}</td><td>${esc(m.location)}</td><td><b>${m.change}</b></td><td>${esc(m.label)}</td></tr>`).join('') || '<tr><td colspan="6">कोई मूवमेंट नहीं</td></tr>'}
  </table></div></div>`;
};

window.downloadBackup = mode => {
  const t = today();
  const data = mode === 'daily'
    ? { mode:'daily', date:t, store:{ ...store, transactions: store.transactions.filter(x => x.tx_date === t) } }
    : { mode:'full', exportedAt: new Date().toISOString(), store };
  if(mode === 'daily') cfg.lastDailyBackup = t;
  persist();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
  a.download = `Sadhna-Agro-${mode.toUpperCase()}-${t}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  safeRender();
};

window.toggleCancelTx = toggleCancelTx;

loadStorage();
safeRender();
window.addEventListener('online', () => runCloudSync(false));
window.addEventListener('DOMContentLoaded', async () => {
  try{
    await connectSupabase();
    await runCloudSync(false);
    safeRender();
  }catch(e){ console.warn('Offline startup:', e); }
});
</script>
</body>
</html>
