<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sadhna Agro ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#173b32;--bg:#f4f6f3;--line:#e2e8e3;--muted:#68756e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,sans-serif;color:#1e2925}
header{background:var(--g);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:21px}header small{color:#dce9df}
.layout{display:flex;min-height:calc(100vh - 65px)}
nav{width:205px;background:#fff;border-right:1px solid var(--line);padding:10px}
nav button{display:block;width:100%;text-align:left;background:none;color:#26332c;margin:3px 0;border-radius:6px;padding:8px}
nav button.active,nav button:hover{background:#eaf1eb;color:var(--g)}
main{padding:20px;max-width:1200px;width:100%;margin:auto}h2{margin:0 0 15px}h3{margin:0 0 10px}
button{border:0;border-radius:8px;background:var(--g);color:#fff;padding:10px 13px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e9efea;color:var(--g)}.danger{background:#a83434;padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:13px}
.metric{font-size:26px;font-weight:750;color:var(--g);margin-top:6px}.muted{color:var(--muted);font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input,select{width:100%;padding:10px;border:1px solid #cbd6ce;border-radius:8px;background:#fff;font:inherit}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px;align-items:end}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted)}
.tablewrap{overflow:auto}.notice{padding:12px;background:#fff7e6;border:1px solid #f1dba8;border-radius:9px;color:#634b1d;font-size:13px;margin-bottom:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.empty{text-align:center;color:var(--muted);padding:15px}
.good{color:#1d7a46;font-weight:700}.bad{color:#a83434;font-weight:700}
@media(max-width:650px){.layout{display:block}nav{width:100%;display:flex;overflow:auto;border:0;border-bottom:1px solid var(--line);padding:5px}nav button{white-space:nowrap;width:auto}main{padding:13px}header{padding:13px}}
</style></head><body>
<header><div><h1>🌾 SADHNA AGRO</h1><small>Manufacturing &amp; Packing Cloud ERP</small></div><small id="today"></small></header>
<div class="layout">
<nav id="nav">
<button data-page="dashboard" class="active">▦ डैशबोर्ड</button>
<button data-page="products">▣ उत्पाद मास्टर</button>
<button data-page="purchase">＋ खरीद एंट्री</button>
<button data-page="stock">▤ स्टॉक</button>
<button data-page="packing">□ पैकिंग / उत्पादन</button>
<button data-page="daily">🏭 दैनिक उत्पादन शीट</button>
<button data-page="reports">▥ रिपोर्ट</button>
</nav>
<main id="app"><div class="card">लोड हो रहा है... कृपया प्रतीक्षा करें।</div></main>
</div>
<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

let supabaseClient = null;
if (window.supabase && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let db = { products: [], purchases: [], batches: [], daily: [] };

async function loadData() {
    if (!supabaseClient) {
        try { db = JSON.parse(localStorage.getItem('sadhna_agro_erp_cloud')) || db; } catch(e){}
        initApp();
        return;
    }
    try {
        let [p, pur, bat, dai] = await Promise.all([
            supabaseClient.from('products').select('*'),
            supabaseClient.from('purchases').select('*'),
            supabaseClient.from('batches').select('*'),
            supabaseClient.from('daily').select('*')
        ]);
        db.products = p.data || [];
        db.purchases = pur.data || [];
        db.batches = bat.data || [];
        db.daily = dai.data || [];
    } catch(err) {
        console.error('Cloud load error:', err);
    }
    initApp();
}

async function saveData(table, item) {
    if (!supabaseClient) {
        db[table].push(item);
        localStorage.setItem('sadhna_agro_erp_cloud', JSON.stringify(db));
        initApp();
        return;
    }
    let { data, error } = await supabaseClient.from(table).insert([item]).select();
    if (error) {
        alert('डेटा सेव करने में त्रुटि: ' + error.message);
    } else {
        if(data && data[0]) db[table].push(data[0]);
        initApp();
    }
}

async function removeData(table, id) {
    if (!supabaseClient) {
        db[table] = db[table].filter(x => x.id !== id);
        localStorage.setItem('sadhna_agro_erp_cloud', JSON.stringify(db));
        initApp();
        return;
    }
    let { error } = await supabaseClient.from(table).delete().eq('id', id);
    if (error) {
        alert('डेटा हटाने में त्रुटि: ' + error.message);
    } else {
        db[table] = db[table].filter(x => x.id !== id);
        initApp();
    }
}

const fmt = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '' + Math.random());
const todayISO = () => new Date().toISOString().slice(0, 10);

document.getElementById('today').textContent = new Date().toLocaleDateString('hi-IN', { dateStyle: 'medium' });

const pages = { dashboard, products, purchase, stock, packing, daily, reports };
document.getElementById('nav').addEventListener('click', e => {
    const b = e.target.closest('[data-page]');
    if (b) go(b.dataset.page);
});

let currentPage = 'dashboard';
function go(p) {
    currentPage = p;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.page === p));
    pages[p]();
}

function initApp() {
    if(pages[currentPage]) pages[currentPage]();
}

const nameOf = id => db.products.find(p => p.id === id)?.name || 'हटाया गया उत्पाद';
const options = () => db.products.map(p => '<option value="' + p.id + '">' + esc(p.name) + ' (' + esc(p.category) + ')</option>').join('');
const bought = id => db.purchases.filter(x => x.product === id).reduce((s, x) => s + x.qty, 0);
const used = id => db.batches.filter(x => x.product === id).reduce((s, x) => s + x.qty, 0);

// खरीद की कुल रकम (GST सहित) निकालने के लिए हेल्पर फंक्शन
const purTotal = x => {
    const base = (Number(x.qty) || 0) * (Number(x.rate) || 0);
    const gst = Number(x.gst) || 0;
    return base + (base * gst / 100);
};

function dashboard() {
    const q = db.purchases.reduce((s, x) => s + x.qty, 0), p = db.batches.reduce((s, x) => s + x.qty, 0),
          amt = db.purchases.reduce((s, x) => s + purTotal(x), 0), packs = db.batches.reduce((s, x) => s + (x.packs || 0), 0);
    const low = db.products.filter(x => bought(x.id) - used(x.id) < 5 && bought(x.id) > 0);
    
    document.getElementById('app').innerHTML = `<h2>डैशबोर्ड</h2>
    <div class="grid">
     <div class="card"><div class="muted">कुल उत्पाद</div><div class="metric">${db.products.length}</div></div>
     <div class="card"><div class="muted">कुल खरीदी मात्रा</div><div class="metric">${q.toFixed(2)} kg</div></div>
     <div class="card"><div class="muted">कुल खरीद रकम (GST सहित)</div><div class="metric">${fmt(amt)}</div></div>
     <div class="card"><div class="muted">कुल पैकिंग मात्रा</div><div class="metric">${p.toFixed(2)} kg</div></div>
     <div class="card"><div class="muted">कुल पैकेट बने</div><div class="metric">${packs}</div></div></div>
     ${low.length ? `<div class="notice"><b>कम स्टॉक (5 kg से कम):</b> ${low.map(x => esc(x.name)).join(', ')}</div>` : ''}
     <div class="notice">क्लाउड मोड एक्टिव है। डेटा सुरक्षित रूप से सिंक हो रहा है।</div>`;
}

function products() {
    document.getElementById('app').innerHTML = `<h2>उत्पाद मास्टर</h2>
    <div class="card"><h3>नया उत्पाद</h3><form id="pf" class="form">
     <div><label>उत्पाद का नाम *</label><input name="name" required placeholder="जैसे जीरा"></div>
     <div><label>कैटेगरी</label><select name="category"><option>मसाले</option><option>ड्राई फ्रूट्स</option><option>सीड्स</option><option>डिहाइड्रेटेड प्रोडक्ट्स</option><option>अन्य</option></select></div>
     <div><label>यूनिट</label><select name="unit"><option>kg</option><option>gram</option><option>piece</option><option>packet</option></select></div>
     <button>उत्पाद सेव करें</button></form></div>
    <div class="card"><h3>उत्पाद सूची</h3><div class="tablewrap"><table><tr><th>नाम</th><th>कैटेगरी</th><th>यूनिट</th><th></th></tr>
    ${db.products.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.unit)}</td><td><button class="danger" onclick="delProduct('${p.id}')">हटाएँ</button></td></tr>`).join('') || '<tr><td colspan="4" class="empty">अभी कोई उत्पाद नहीं</td></tr>'}</table></div></div>`;
    
    document.getElementById('pf').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        await saveData('products', { id: uid(), name: f.get('name').trim(), category: f.get('category'), unit: f.get('unit') });
    };
}
window.delProduct = id => removeData('products', id);

function purchase() {
    if(!db.products.length) { document.getElementById('app').innerHTML = `<h2>खरीद एंट्री</h2><div class="notice">कृपया पहले 'उत्पाद मास्टर' में जाकर उत्पाद जोड़ें।</div>`; return; }
    document.getElementById('app').innerHTML = `<h2>खरीद एंट्री</h2>
    <div class="card"><form id="purf" class="form">
     <div><label>किस से खरीदा (पार्टी) *</label><input name="supplier" required placeholder="सप्लायर / व्यापारी का नाम"></div>
     <div><label>बिल नंबर *</label><input name="bill_no" required placeholder="जैसे INV-101"></div>
     <div><label>उत्पाद</label><select name="product">${options()}</select></div>
     <div><label>मात्रा (kg)</label><input type="number" step="0.01" name="qty" required placeholder="0.00"></div>
     <div><label>रेट प्रति kg (₹)</label><input type="number" step="0.01" name="rate" required placeholder="0.00"></div>
     <div><label>GST (%)</label><select name="gst">
        <option value="0">0% (बिना GST)</option>
        <option value="5">5%</option>
        <option value="12">12%</option>
        <option value="18">18%</option>
        <option value="28">28%</option>
     </select></div>
     <div><label>दिनांक</label><input type="date" name="date" value="${todayISO()}"></div>
     <button>खरीद सेव करें</button></form></div>
    <div class="card"><h3>खरीद इतिहास</h3><div class="tablewrap"><table>
    <tr><th>दिनांक</th><th>बिल नं.</th><th>पार्टी (सप्लायर)</th><th>उत्पाद</th><th>मात्रा</th><th>रेट</th><th>GST</th><th>कुल रकम</th><th></th></tr>
    ${db.purchases.slice(-25).reverse().map(x => `<tr>
        <td>${x.date}</td>
        <td>${esc(x.bill_no || '-')}</td>
        <td>${esc(x.supplier || '-')}</td>
        <td><b>${nameOf(x.product)}</b></td>
        <td>${x.qty} kg</td>
        <td>${fmt(x.rate)}</td>
        <td>${x.gst || 0}%</td>
        <td><b>${fmt(purTotal(x))}</b></td>
        <td><button class="danger" onclick="delPur('${x.id}')">हटाएँ</button></td>
    </tr>`).join('') || '<tr><td colspan="9" class="empty">कोई खरीद एंट्री नहीं</td></tr>'}</table></div></div>`;
    
    document.getElementById('purf').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        await saveData('purchases', { 
            id: uid(), 
            supplier: f.get('supplier').trim(),
            bill_no: f.get('bill_no').trim(),
            product: f.get('product'), 
            qty: Number(f.get('qty')), 
            rate: Number(f.get('rate')), 
            gst: Number(f.get('gst')),
            date: f.get('date') 
        });
    };
}
window.delPur = id => removeData('purchases', id);

function stock() {
    document.getElementById('app').innerHTML = `<h2>स्टॉक स्थिति</h2>
    <div class="card"><div class="tablewrap"><table><tr><th>उत्पाद</th><th>खरीद (kg)</th><th>पैकिंग उपयोग (kg)</th><th>शेष (kg)</th></tr>
    ${db.products.map(p => {
        let b = bought(p.id), u = used(p.id), rem = b - u;
        return `<tr><td><b>${esc(p.name)}</b></td><td>${b.toFixed(3)}</td><td>${u.toFixed(3)}</td><td class="${rem < 0 ? 'bad' : 'good'}">${rem.toFixed(3)}</td></tr>`;
    }).join('') || '<tr><td colspan="4" class="empty">कोई उत्पाद उपलब्ध नहीं</td></tr>'}</table></div></div>`;
}

function packing() {
    if(!db.products.length) { document.getElementById('app').innerHTML = `<h2>पैकिंग / उत्पादन</h2><div class="notice">कृपया पहले उत्पाद जोड़ें।</div>`; return; }
    document.getElementById('app').innerHTML = `<h2>पैकिंग / उत्पादन</h2>
    <div class="card"><form id="packf" class="form">
     <div><label>उत्पाद</label><select name="product">${options()}</select></div>
     <div><label>खपत मात्रा (kg)</label><input type="number" step="0.01" name="qty" required placeholder="0.00"></div>
     <div><label>पैकेट संख्या</label><input type="number" name="packs" required placeholder="0"></div>
     <div><label>दिनांक</label><input type="date" name="date" value="${todayISO()}"></div>
     <button>पैकिंग सेव करें</button></form></div>
    <div class="card"><h3>पैकिंग इतिहास</h3><div class="tablewrap"><table><tr><th>दिनांक</th><th>उत्पाद</th><th>खपत (kg)</th><th>पैकेट बने</th><th></th></tr>
    ${db.batches.slice(-20).reverse().map(x => `<tr><td>${x.date}</td><td><b>${nameOf(x.product)}</b></td><td>${x.qty} kg</td><td>${x.packs} पैकेट</td><td><button class="danger" onclick="delBatch('${x.id}')">हटाएँ</button></td></tr>`).join('') || '<tr><td colspan="5" class="empty">कोई पैकिंग एंट्री नहीं</td></tr>'}</table></div></div>`;
    
    document.getElementById('packf').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        await saveData('batches', { id: uid(), product: f.get('product'), qty: Number(f.get('qty')), packs: Number(f.get('packs')), date: f.get('date') });
    };
}
window.delBatch = id => removeData('batches', id);

function daily() {
    document.getElementById('app').innerHTML = `<h2>दैनिक उत्पादन शीट</h2>
    <div class="card"><form id="dailyf" class="form">
     <div><label>दिनांक</label><input type="date" name="date" value="${todayISO()}"></div>
     <div><label>विवरण / गतिविधि</label><input name="note" required placeholder="जैसे: जीरा पैकिंग कार्य"></div>
     <div><label>कुल पैकेट/मात्रा</label><input name="output" required placeholder="जैसे: 500 पैकेट"></div>
     <button>सेव करें</button></form></div>
    <div class="card"><h3>दैनिक रिकॉर्ड</h3><div class="tablewrap"><table><tr><th>दिनांक</th><th>विवरण</th><th>उत्पादन आउटपुट</th><th></th></tr>
    ${db.daily.slice(-20).reverse().map(x => `<tr><td>${x.date}</td><td>${esc(x.note)}</td><td><b>${esc(x.output)}</b></td><td><button class="danger" onclick="delDaily('${x.id}')">हटाएँ</button></td></tr>`).join('') || '<tr><td colspan="4" class="empty">कोई रिकॉर्ड नहीं</td></tr>'}</table></div></div>`;
    
    document.getElementById('dailyf').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        await saveData('daily', { id: uid(), date: f.get('date'), note: f.get('note').trim(), output: f.get('output').trim() });
    };
}
window.delDaily = id => removeData('daily', id);

function reports() {
    const totalAmt = db.purchases.reduce((s, x) => s + purTotal(x), 0);
    document.getElementById('app').innerHTML = `<h2>रिपोर्ट</h2>
    <div class="card"><h3>कुल कारोबार सारांश</h3>
    <p>कुल उत्पाद: <b>${db.products.length}</b></p>
    <p>कुल खरीद प्रविष्टियाँ: <b>${db.purchases.length}</b></p>
    <p>कुल खरीद खर्च (GST सहित): <b>${fmt(totalAmt)}</b></p>
    <p>कुल पैकिंग बैचेस: <b>${db.batches.length}</b></p></div>`;
}

// ऐप शुरू करें
loadData();
</script>
</body></html>
